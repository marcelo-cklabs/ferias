          - { rotulo: "Volta GRU → Goiânia", valor: "− R$ 1.177,30 · Marcelo R$ 504,65 (ainda sem mala) + Sabrina R$ 672,65" }
          - { rotulo: "Hotel · 1 dos 3 quartos", valor: "− R$ 7.659,44" }
          - { rotulo: "Ida GYN → GRU · 2 dos 6 bilhetes", valor: "− R$ 1.257,64" }
        total: "Ver Gastos"
    notas:
      - "💡 **Por que o rateio é limpo:** a tarifa da Smiles é **por pessoa**, não um bolo dividido — 57.000 na ida + 64.500 na volta = **121.500 por viajante**. Cada um consome exatamente a sua."
      - "🏷️ **Por que R$ 15,80 o milheiro:** é o teto de compra de milha Smiles usado no painel e na consultoria, e é um preço verificável na tela da própria Smiles. Não é número inventado — dá para mostrar de onde veio."
      - "⚖️ **O que esse preço ressarce.** Das 729.000, **414.112 são milhas acumuladas do Marcelo** (estoque de 307.291 + Clube + Livelo + C6) e 314.888 serão compradas. Marcelo e Sabrina consomem 243.000, então **171.112 milhas acumuladas vão para os outros quatro** — e é por elas que o caixa **do internacional** fecha em +R$ 1.630,82, depois de descontada a parte dele na taxa. Se as milhas fossem cobradas só pelo desembolso, ele doaria essas 171.112 (~R$ 2.700) e ainda pagaria a própria taxa."
      - "📉 **Referência para eles:** GRU–JFK ida e volta em econômica, direto, custa **R$ 4.000 a 6.000 por pessoa** em dinheiro. R$ 2.456,19 é aproximadamente metade."
      - "🗓️ **O que já veio.** Os R$ 2.145,96 da taxa, que saíram do bolso do Marcelo em 25/09, **foram pagos** em 10/11/2026, junto com a volta (Pix de **R$ 4.850,00**). Em **17/11/2026**, dia da compra das milhas, a Ana Claudia mandou **R$ 5.627,16** por Pix — exatamente o valor pago pelas 360.000 milhas. Das milhas dos quatro (R$ 7.678,80) faltam **R$ 2.051,20**, já descontados os R$ 0,44 pagos a mais em 10/11."
      - "🏨 **Hotel: R$ 22.978,32 pagos em 14/11/2026** na conta Hoteis.com do Marcelo, três quartos iguais (um em nome de cada casal). Mesma divisão da viagem: Marcelo paga o quarto dele e da Sabrina, **R$ 7.659,44**, e a Ana Claudia paga os outros dois, **R$ 15.318,88**."
      - "✈️ **Ida GYN → GRU: R$ 3.772,92 pagos em 14/11/2026** no cartão de crédito final 0203, pelos seis bilhetes da reserva QKPAFX, com assento GOL+ Conforto e mala despachada de 23 kg. O site da GOL não mostra o valor por passageiro, então a divisão é igual: **R$ 628,82 por bilhete**, R$ 2.515,28 da parte dos quatro. Ajustar se o recibo mostrar diferença de assento."
      - "✈️ **A volta GRU → Goiânia entra à parte.** Os seis bilhetes saíram em 12/10/2026 no cartão do Marcelo (Mastercard C6 final 5739, em **3×**), e cada um dos quatro devolve **o próprio bilhete**, no valor que está no recibo dele — **R$ 2.703,60** no total."
      - "✅ **Volta quitada de uma vez.** Em 10/11/2026 a Ana Claudia pagou os R$ 2.703,60 dos quatro, inclusive as parcelas que ainda iam vencer. O 3× segue só na fatura do Marcelo (vencimentos esperados em 05/11/2026, 05/12/2026 e 05/01/2027)."
      - "🧾 **Somando o internacional e a volta, a parte dos quatro é R$ 12.528,36** (Ana Claudia R$ 3.135,84 · Christopher R$ 3.128,84 · Luci R$ 3.131,84 · Ulisses R$ 3.131,84). **R$ 4.850,00 foram pagos** em 10/11/2026, a taxa e a volta (R$ 0,44 a mais, arredondado), e **R$ 5.627,16** em 17/11/2026, das milhas. Somando hotel e ida GYN→GRU, **faltam R$ 19.885,36**."
      - "🚩 **Combinar antes o que acontece se alguém desistir.** A tarifa é reembolsável, mas o cancelamento custa **US$ 180 por viajante** e a taxa do Viaje Fácil (R$ 249,90, ou R$ 41,65 por pessoa) **não volta**. Definir agora quem arca com isso evita conversa ruim depois."
