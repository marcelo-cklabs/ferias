  - tipo: ficha
    titulo: "Rateio · quem paga o quê"
    icone: "🤝"
    cartoes:
      - titulo: "Os quatro"
        subtitulo: "Christopher, Ana Claudia, Luci e Ulisses · pagamento único"
        entradas:
          - { rotulo: "Passagens", valor: "486.000 milhas (121.500 cada)" }
          - { rotulo: "Milhas a R$ 15,80/milheiro", valor: "R$ 7.678,80" }
          - { rotulo: "Taxa de embarque + Viaje Fácil", valor: "R$ 2.145,96 (4 × R$ 536,49)" }
          - { rotulo: "**Por pessoa**", valor: "**R$ 2.456,19**" }
        total: "A receber: R$ 9.824,76"
      - titulo: "Marcelo & Sabrina"
        subtitulo: "as passagens saem do estoque"
        entradas:
          - { rotulo: "Passagens", valor: "243.000 milhas (121.500 cada)" }
          - { rotulo: "De onde saem", valor: "do saldo Smiles que já existia" }
          - { rotulo: "Taxa de embarque + Viaje Fácil", valor: "R$ 1.072,98 (2 × R$ 536,49)" }
          - { rotulo: "**Resultado de caixa**", valor: "**+R$ 1.630,82**" }
        total: "Sem desembolso líquido"
    notas:
      - "💡 **Por que o rateio é limpo:** a tarifa da Smiles é **por pessoa**, não um bolo dividido — 57.000 na ida + 64.500 na volta = **121.500 por viajante**. Cada um consome exatamente a sua."
      - "🏷️ **Por que R$ 15,80 o milheiro:** é o teto de compra de milha Smiles usado no painel e na consultoria, e é um preço verificável na tela da própria Smiles. Não é número inventado — dá para mostrar de onde veio."
      - "⚖️ **O que esse preço ressarce.** Das 729.000, **414.112 são milhas acumuladas do Marcelo** (estoque de 307.291 + Clube + Livelo + C6) e 314.888 serão compradas. Marcelo e Sabrina consomem 243.000, então **171.112 milhas acumuladas vão para os outros quatro** — e é por elas que o caixa fecha em +R$ 1.630,82, depois de descontada a parte dele na taxa. Se as milhas fossem cobradas só pelo desembolso, ele doaria essas 171.112 (~R$ 2.700) e ainda pagaria a própria taxa."
      - "📉 **Referência para eles:** GRU–JFK ida e volta em econômica, direto, custa **R$ 4.000 a 6.000 por pessoa** em dinheiro. R$ 2.456,19 é aproximadamente metade."
      - "🗓️ **Quando cobrar.** Os R$ 2.145,96 da taxa já saíram do bolso do Marcelo em 25/09 — esses cabem cobrar agora. Os R$ 7.678,80 das milhas podem vir até **15/03/2027**, ou em duas parcelas casadas com as compras de novembro e março, o que evita o Marcelo financiar ~R$ 5.000 por seis meses."
      - "🚩 **Combinar antes o que acontece se alguém desistir.** A tarifa é reembolsável, mas o cancelamento custa **US$ 180 por viajante** e a taxa do Viaje Fácil (R$ 249,90, ou R$ 41,65 por pessoa) **não volta**. Definir agora quem arca com isso evita conversa ruim depois."
  - tipo: checklist
    titulo: "Passageiros · documentos"
    icone: "🛂"
    itens:
      - texto: "✅ **Christopher Hoxsie**"
        detalhe: "passaporte válido · visto americano válido"
      - texto: "✅ **Ana Claudia Hoxsie**"
        detalhe: "passaporte válido · visto americano válido"
      - texto: "✅ **Luci Oliveira**"
        detalhe: "passaporte válido · visto americano válido"
      - texto: "✅ **Ulisses Paiva**"
        detalhe: "passaporte válido · visto americano válido"
      - texto: "✅ **Sabrina**"
        detalhe: "passaporte válido · visto americano válido"
      - texto: "🇨🇦 **Marcelo** — passaporte canadense válido, **e não precisa de visto**"
        detalhe: 'O Departamento de Estado americano é explícito: *"Citizens of Canada and Bermuda generally do not require visas to enter the United States, for visit, tourism and temporary business travel purposes."* E o Canadá **não** faz parte do Visa Waiver Program, então também **não usa ESTA** — a isenção é por via própria. Entra com o passaporte canadense e pronto. Restam as duas tarefas abaixo, que são de documento, não de fila'
      - texto: "🚨 **Conferir o nome da reserva contra o passaporte CANADENSE**"
        detalhe: "A reserva já foi emitida com um nome. Se ele estiver na grafia do documento brasileiro e o embarque for no canadense, dá problema no check-in. Passaporte canadense costuma perder acentos e pode trazer a ordem dos nomes diferente. **Conferir letra por letra agora** — correção de nome em bilhete Smiles é cara quando é possível"
      - texto: "🇧🇷 **RG válido para sair e voltar ao Brasil**"
        detalhe: "A Polícia Federal permite que brasileiro com dupla nacionalidade use o passaporte estrangeiro para sair e entrar no Brasil, **mas exige RG válido junto**, com foto que identifique a pessoa. **CNH e carteira profissional não servem.** Sem o RG, a imigração registra a pessoa como estrangeira e ela cai na Lei de Migração, sujeita a prazo de permanência e multa — no próprio país"
      - texto: "📇 **Atualizar o número do documento na reserva Smiles**"
        detalhe: "A companhia manda os dados de passageiro para a imigração americana antes do voo (APIS). O documento informado tem de ser o mesmo com que se embarca — no caso do Marcelo, o canadense"
