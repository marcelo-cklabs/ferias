      - texto: "✅ **Sabrina**"
        detalhe: "passaporte válido · visto americano válido"
      - texto: "🇨🇦 **Marcelo** — passaporte canadense válido, **e não precisa de visto**"
        detalhe: 'O Departamento de Estado americano é explícito: *"Citizens of Canada and Bermuda generally do not require visas to enter the United States, for visit, tourism and temporary business travel purposes."* E o Canadá **não** faz parte do Visa Waiver Program, então também **não usa ESTA** — a isenção é por via própria. Entra com o passaporte canadense e pronto. Restam as duas tarefas abaixo, que são de documento, não de fila'
      - texto: "🚨 **Conferir o nome da reserva contra o passaporte CANADENSE**"
        detalhe: "A reserva já foi emitida com um nome. Se ele estiver na grafia do documento brasileiro e o embarque for no canadense, dá problema no check-in. Passaporte canadense costuma perder acentos e pode trazer a ordem dos nomes diferente. **Conferir letra por letra agora** — correção de nome em bilhete Smiles é cara quando é possível"
      - texto: "🇧🇷 **RG válido para sair e voltar ao Brasil**"
        detalhe: "A Polícia Federal permite que brasileiro com dupla nacionalidade use o passaporte estrangeiro para sair e entrar no Brasil, **mas exige RG válido junto**, com foto que identifique a pessoa. **CNH e carteira profissional não servem.** Sem o RG, a imigração registra a pessoa como estrangeira e ela cai na Lei de Migração, sujeita a prazo de permanência e multa — no próprio país"
      - texto: "📇 **Atualizar o número do documento na reserva Smiles**"
        detalhe: "A companhia manda os dados de passageiro para a imigração americana antes do voo (APIS). O documento informado tem de ser o mesmo com que se embarca — no caso do Marcelo, o canadense"
