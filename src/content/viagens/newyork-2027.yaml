        detalhe: "A lista de atrações abaixo nasceu quando a viagem era de 14 dias para o casal. Refazer para 8 dias e um grupo de 6"
      - texto: "🎫 **Inserir o localizador aqui na emissão**"
        detalhe: "Ele só nasce quando o bilhete for pago, até 01/04/2027"
