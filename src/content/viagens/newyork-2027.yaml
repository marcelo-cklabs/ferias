        subtitulo: "as passagens saem do estoque"
        entradas:
          - { rotulo: "Passagens", valor: "243.000 milhas (121.500 cada)" }
          - { rotulo: "De onde saem", valor: "do saldo Smiles que já existia" }
          - { rotulo: "Taxa de embarque + Viaje Fácil", valor: "R$ 1.072,98 (2 × R$ 536,49)" }
          - { rotulo: "Caixa do internacional", valor: "+R$ 1.630,82" }
          - { rotulo: "Volta GRU → Goiânia", valor: "− R$ 1.177,30 · Marcelo R$ 504,65 (ainda sem mala) + Sabrina R$ 672,65" }
          - { rotulo: "**Resultado de caixa**", valor: "**+R$ 453,52**" }
        total: "Sem desembolso líquido"
    notas:
      - "💡 **Por que o rateio é limpo:** a tarifa da Smiles é **por pessoa**, não um bolo dividido — 57.000 na ida + 64.500 na volta = **121.500 por viajante**. Cada um consome exatamente a sua."
      - "🏷️ **Por que R$ 15,80 o milheiro:** é o teto de compra de milha Smiles usado no painel e na consultoria, e é um preço verificável na tela da própria Smiles. Não é número inventado — dá para mostrar de onde veio."
      - "⚖️ **O que esse preço ressarce.** Das 729.000, **414.112 são milhas acumuladas do Marcelo** (estoque de 307.291 + Clube + Livelo + C6) e 314.888 serão compradas. Marcelo e Sabrina consomem 243.000, então **171.112 milhas acumuladas vão para os outros quatro** — e é por elas que o caixa **do internacional** fecha em +R$ 1.630,82, depois de descontada a parte dele na taxa. Se as milhas fossem cobradas só pelo desembolso, ele doaria essas 171.112 (~R$ 2.700) e ainda pagaria a própria taxa."
      - "📉 **Referência para eles:** GRU–JFK ida e volta em econômica, direto, custa **R$ 4.000 a 6.000 por pessoa** em dinheiro. R$ 2.456,19 é aproximadamente metade."
      - "🗓️ **Quando cobrar.** Os R$ 2.145,96 da taxa já saíram do bolso do Marcelo em 25/09 — esses cabem cobrar agora. Os R$ 7.678,80 das milhas podem vir até **15/03/2027**, ou em duas parcelas casadas com as compras de novembro e março, o que evita o Marcelo financiar ~R$ 5.000 por seis meses."
      - "✈️ **A volta GRU → Goiânia entra à parte.** Os seis bilhetes saíram em 12/10/2026 no cartão do Marcelo (Mastercard C6 final 5739, em **3×**), e cada um dos quatro devolve **o próprio bilhete**, no valor que está no recibo dele — **R$ 2.703,60** no total."
      - "🗓️ **Como cobrar a volta.** Em 3 parcelas iguais, casadas com as faturas do cartão: o C6 fecha por volta do dia 29 e vence no dia 5, então os vencimentos esperados são **05/11/2026, 05/12/2026 e 05/01/2027** — conferir quando a compra aparecer na fatura. Ana Claudia 3× R$ 226,55 · Christopher 2× R$ 224,22 + R$ 224,21 · Luci e Ulisses 2× R$ 225,22 + R$ 225,21 cada. Quem preferir quita de uma vez."
      - "🧾 **Somando o internacional e a volta, os quatro devem R$ 12.528,36:** Ana Claudia R$ 3.135,84 · Christopher R$ 3.128,84 · Luci R$ 3.131,84 · Ulisses R$ 3.131,84. A ida GYN→GRU ainda vai entrar nessa conta."
      - "🚩 **Combinar antes o que acontece se alguém desistir.** A tarifa é reembolsável, mas o cancelamento custa **US$ 180 por viajante** e a taxa do Viaje Fácil (R$ 249,90, ou R$ 41,65 por pessoa) **não volta**. Definir agora quem arca com isso evita conversa ruim depois."
