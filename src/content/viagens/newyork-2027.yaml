    notas:
      - "**Tarifa reembolsável.** Cancelamento custa **US$ 180 por viajante**, cobrado no ato — e as milhas voltam. *(Vale para o internacional.)*"
      - "A ida tem tag **Outlet Clube Smiles**; a volta não. Conferir as regras de remarcação da tarifa outlet antes de mexer em qualquer data."
      - "🎫 **GYN→GRU emitido em 14/11/2026** · GOL **G3 1491**, reserva **QKPAFX**, Boeing 737-800, tarifa **Light**, econômica. Assentos na **fileira 1**: Ana Claudia 01A · Christopher 01B · Ulisses 01C · Luci 01D · Marcelo 01E · Sabrina 01F."
      - "⏱️ **Folga na ida:** pouso em Guarulhos às **12h50** e o voo da AA sai às **22h30** — cerca de 9h40. São **bilhetes separados**: se o doméstico atrasar ou cancelar, a AA não tem obrigação de remarcar. A folga cobre atraso comum. Num cancelamento, a saída é o próximo voo da GOL no mesmo dia."
      - "🧳 **Tarifa Light na ida também:** sem mala despachada incluída, para nenhum dos seis."
      - "🎫 **GRU→GYN emitido em 12/10/2026** · GOL **G3 1492**, Boeing 737-800, tarifa **Light**, econômica. Assentos **GOL+ Conforto na fileira 1**: Ana Claudia 01A · Christopher 01B · Luci 01C · Ulisses 01D · Sabrina 01E · Marcelo 01F."
      - "🧳 **A tarifa Light da volta não leva mala despachada.** Foi comprada a 1ª bagagem (R$ 175,00) para cinco dos seis — **falta a do Marcelo**, que vai incluir na reserva."
      - "⏱️ **Folga na volta:** o voo de Nova York pousa em Guarulhos às **06h55** e o da GOL sai às **17h00** do **Terminal 2** — cerca de 10 horas. São **bilhetes separados**: passar pela imigração, retirar as malas e despachar de novo no balcão da GOL."
      - "A volta GRU→GYN entra no rateio **à parte**: cada um dos quatro devolve o próprio bilhete, e a parte deles **já foi paga** em 10/11/2026 (ver *Rateio*). A ida (QKPAFX) entra do mesmo jeito, assim que o valor for lançado em *Gastos*."
      - "🎫 **Internacional emitido em 17/11/2026** · localizador **APZHTN**, American Airlines, ida e volta diretas."
