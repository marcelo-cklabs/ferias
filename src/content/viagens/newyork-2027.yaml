  - tipo: ficha
    titulo: "Rateio · quem paga o quê"
    icone: "🤝"
    cartoes:
      - titulo: "Os quatro"
        subtitulo: "Christopher, Ana Claudia, Luci e Ulisses · a Ana Claudia paga pelos quatro"
        entradas:
          - { rotulo: "Passagens", valor: "486.000 milhas (121.500 cada)" }
          - { rotulo: "Milhas a R$ 15,80/milheiro", valor: "R$ 7.678,80 · a receber (milhas já compradas e bilhete emitido)" }
          - { rotulo: "Taxa de embarque + Viaje Fácil", valor: "R$ 2.145,96 (4 × R$ 536,49) · ✅ **paga em 10/11/2026**" }
          - { rotulo: "**Por pessoa**", valor: "**R$ 2.456,19**" }
        total: "A receber: R$ 7.678,80"
      - titulo: "Os quatro · volta GRU → Goiânia"
        subtitulo: "GOL, 08/06 · cada um paga o próprio bilhete · quitada em 10/11/2026"
        entradas:
          - { rotulo: "Ana Claudia", valor: "**R$ 679,65** · assento 01A (janela, R$ 113,00)" }
          - { rotulo: "Christopher", valor: "**R$ 672,65** · assento 01B (meio, R$ 106,00)" }
          - { rotulo: "Luci", valor: "**R$ 675,65** · assento 01C (corredor, R$ 109,00)" }
          - { rotulo: "Ulisses", valor: "**R$ 675,65** · assento 01D (corredor, R$ 109,00)" }
          - { rotulo: "Cada bilhete", valor: "passagem R$ 391,65 + assento + mala despachada R$ 175,00" }
        total: "Recebido: R$ 2.703,60"
      - titulo: "Marcelo & Sabrina"
        subtitulo: "as passagens saem do estoque"
        entradas:
          - { rotulo: "Passagens", valor: "243.000 milhas (121.500 cada)" }
          - { rotulo: "De onde saem", valor: "do saldo Smiles que já existia" }
          - { rotulo: "Taxa de embarque + Viaje Fácil", valor: "R$ 1.072,98 (2 × R$ 536,49)" }
          - { rotulo: "Caixa do internacional", valor: "+R$ 978,66" }
          - { rotulo: "Volta GRU → Goiânia", valor: "− R$ 1.177,30 · Marcelo R$ 504,65 (ainda sem mala) + Sabrina R$ 672,65" }
          - { rotulo: "**Resultado de caixa**", valor: "**− R$ 198,64**" }
        total: "Desembolso líquido: R$ 198,64"
    notas:
      - "💡 **Por que o rateio é limpo:** a tarifa da Smiles é **por pessoa**, não um bolo dividido — 57.000 na ida + 64.500 na volta = **121.500 por viajante**. Cada um consome exatamente a sua."
      - "🏷️ **Por que R$ 15,80 o milheiro:** é o teto de compra de milha Smiles usado no painel e na consultoria, e é um preço verificável na tela da própria Smiles. Não é número inventado — dá para mostrar de onde veio."
      - "⚖️ **O que esse preço ressarce.** Das 729.000, **369.000 são milhas acumuladas do Marcelo** (o saldo Smiles + os 9.007 do C6) e **360.000 foram compradas** via Livelo por R$ 5.627,16. Marcelo e Sabrina consomem 243.000, então **126.000 milhas acumuladas vão para os outros quatro** — e é por elas que o caixa **do internacional** fecha em +R$ 978,66, depois de descontada a parte dele na taxa. Se as milhas fossem cobradas só pelo desembolso, ele doaria essas 126.000 (~R$ 2.000) e ainda pagaria a própria taxa."
      - "📉 **Referência para eles:** GRU–JFK ida e volta em econômica, direto, custa **R$ 4.000 a 6.000 por pessoa** em dinheiro. R$ 2.456,19 é aproximadamente metade."
      - "🗓️ **Quando cobrar.** Os R$ 2.145,96 da taxa, que saíram do bolso do Marcelo em 25/09, **já foram pagos** em 10/11/2026, junto com a volta. Faltam os R$ 7.678,80 das milhas. O prazo combinado era **15/03/2027**, mas as milhas foram compradas e o bilhete foi emitido em 17/11/2026: cobrar agora evita o Marcelo financiar os R$ 5.627,16 do Pix por quatro meses."
      - "✈️ **A volta GRU → Goiânia entra à parte.** Os seis bilhetes saíram em 12/10/2026 no cartão do Marcelo (Mastercard C6 final 5739, em **3×**), e cada um dos quatro devolve **o próprio bilhete**, no valor que está no recibo dele — **R$ 2.703,60** no total."
      - "✅ **Volta quitada de uma vez.** Em 10/11/2026 a Ana Claudia pagou os R$ 2.703,60 dos quatro, inclusive as parcelas que ainda iam vencer. O 3× segue só na fatura do Marcelo (vencimentos esperados em 05/11/2026, 05/12/2026 e 05/01/2027)."
      - "🧾 **Somando o internacional e a volta, a parte dos quatro é R$ 12.528,36** (Ana Claudia R$ 3.135,84 · Christopher R$ 3.128,84 · Luci R$ 3.131,84 · Ulisses R$ 3.131,84). **R$ 4.849,56 já foram pagos** em 10/11/2026, a taxa e a volta, e **faltam R$ 7.678,80**, das milhas. A ida GYN→GRU (QKPAFX) ainda vai entrar nessa conta."
      - "🚩 **Combinar o que acontece se alguém desistir.** A tarifa é reembolsável, mas o cancelamento custa **US$ 180 por viajante** e a taxa do Viaje Fácil (R$ 249,90, ou R$ 41,65 por pessoa) **não volta**. Definir agora quem arca com isso evita conversa ruim depois."
  - tipo: checklist
    titulo: "Passageiros · documentos"
    icone: "🛂"
    itens:
      - texto: "✅ **Christopher**"
        detalhe: "passaporte válido · visto americano válido"
      - texto: "✅ **Ana Claudia**"
        detalhe: "passaporte válido · visto americano válido"
      - texto: "✅ **Luci**"
        detalhe: "passaporte válido · visto americano válido"
      - texto: "✅ **Ulisses**"
        detalhe: "passaporte válido · visto americano válido"
      - texto: "✅ **Sabrina**"
        detalhe: "passaporte válido · visto americano válido"
      - texto: "🇨🇦 **Marcelo** — passaporte canadense válido, **e não precisa de visto**"
        detalhe: 'O Departamento de Estado americano é explícito: *"Citizens of Canada and Bermuda generally do not require visas to enter the United States, for visit, tourism and temporary business travel purposes."* E o Canadá **não** faz parte do Visa Waiver Program, então também **não usa ESTA** — a isenção é por via própria. Entra com o passaporte canadense e pronto. Restam as tarefas abaixo, que são de documento, não de fila'
      - texto: "🚨 **Cadastrar passaporte e visto dos 6 no site da American Airlines**"
        detalhe: "Reserva **APZHTN**, na área de viagens do aa.com (dados de viagem segura / passaporte). Para cada viajante: número, país emissor e validade do passaporte, e o visto americano (número e validade). **Marcelo** entra com o passaporte **canadense** e sem visto. A AA manda esses dados à imigração americana antes do voo (APIS), e sem eles o check-in online não libera"
      - texto: "🚨 **Conferir o nome da reserva contra o passaporte CANADENSE**"
        detalhe: "A reserva já foi emitida com um nome. Se ele estiver na grafia do documento brasileiro e o embarque for no canadense, dá problema no check-in. Passaporte canadense costuma perder acentos e pode trazer a ordem dos nomes diferente. **Conferir letra por letra agora** — correção de nome em bilhete Smiles é cara quando é possível"
      - texto: "🇧🇷 **RG válido para sair e voltar ao Brasil**"
        detalhe: "A Polícia Federal permite que brasileiro com dupla nacionalidade use o passaporte estrangeiro para sair e entrar no Brasil, **mas exige RG válido junto**, com foto que identifique a pessoa. **CNH e carteira profissional não servem.** Sem o RG, a imigração registra a pessoa como estrangeira e ela cai na Lei de Migração, sujeita a prazo de permanência e multa — no próprio país"
