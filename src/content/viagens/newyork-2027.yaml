        detalhe: "12 trechos que não existem. Milhas, dinheiro ou estrada — e chegar em Guarulhos na véspera, não no dia do voo das 22h30"
      - texto: "🏨 **Reservar hospedagem para 6, 8 noites**"
        detalhe: "Apartamento de 3 quartos contra quartos de hotel. Começar cedo — imóvel bom para grupo esgota"
      - texto: "💳 **Comprar o lote grande na Black Friday**"
        detalhe: "~157.000 milhas em novembro, metade do que falta. Monitorar a partir de 01/11 e não deixar para a última semana"
      - texto: "🇧🇷 **Checar a validade do RG do Marcelo**"
        detalhe: "É o documento que prova a nacionalidade brasileira na saída, já que o embarque é no passaporte canadense. Sem ele, a PF registra como estrangeiro"
