        detalhe: "R$ 9.824,76 no total, R$ 2.456,19 por pessoa. Os R$ 2.145,96 da taxa já saíram do bolso em 25/09 — esses cabem cobrar agora. E combinar o que acontece se alguém desistir"
      - texto: "❓ **Descobrir se a quitação aceita pagamento parcial**"
        detalhe: "Está nos Termos do Viaje Fácil. Se der para abater as 729.000 conforme as milhas chegam, cada compra vira progresso travado e o risco do plano despenca. Se for tudo-ou-nada em 01/04, qualquer atraso de transferência no fim de março derruba a operação"
