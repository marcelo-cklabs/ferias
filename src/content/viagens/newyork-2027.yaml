        subtitulo: "GOL, 08/06 · cada um paga o próprio bilhete · quitada em 10/11/2026"
        entradas:
          - { rotulo: "Ana Claudia", valor: "**R$ 679,65** · assento 01A (janela, R$ 113,00)" }
          - { rotulo: "Christopher", valor: "**R$ 672,65** · assento 01B (meio, R$ 106,00)" }
