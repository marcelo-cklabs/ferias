    notas:
      - "**Tarifa reembolsável.** Cancelamento custa **US$ 180 por viajante**, cobrado no ato — e as milhas voltam. *(Vale para o internacional.)*"
      - "A ida tem tag **Outlet Clube Smiles**; a volta não. Conferir as regras de remarcação da tarifa outlet antes de mexer em qualquer data."
      - "🚨 **O bilhete parte de GUARULHOS e o grupo está em Goiânia.** A volta **GRU→GYN já está comprada** para os seis (GOL, 08/06 às 17h00). Falta a ida **GYN→GRU** — 6 pernas que ainda não existem em lugar nenhum. Decidir entre milhas (doméstico sai barato e o LATAM Pass tem 19.478 paradas), dinheiro ou estrada. **Chegar em GRU na véspera, não no dia:** pousar no mesmo dia do voo das 22h30 com seis pessoas é risco desnecessário, e um atraso no doméstico custaria as 729.000."
      - "🎫 **GRU→GYN emitido em 12/10/2026** · GOL **G3 1492**, Boeing 737-800, tarifa **Light**, econômica. Assentos **GOL+ Conforto na fileira 1**: Ana Claudia 01A · Christopher 01B · Luci 01C · Ulisses 01D · Sabrina 01E · Marcelo 01F."
      - "🧳 **A tarifa Light não leva mala despachada.** Foi comprada a 1ª bagagem (R$ 175,00) para cinco dos seis — **falta a do Marcelo**, que vai incluir na reserva."
      - "⏱️ **Folga na volta:** o voo de Nova York pousa em Guarulhos às **06h55** e o da GOL sai às **17h00** do **Terminal 2** — cerca de 10 horas. São **bilhetes separados**: passar pela imigração, retirar as malas e despachar de novo no balcão da GOL."
      - "A volta GRU→GYN entra no rateio **à parte**: cada um dos quatro devolve o próprio bilhete (ver *Rateio*). A ida, quando for comprada, entra também."
      - "O internacional segue **sem localizador** — ele só nasce quando o bilhete for emitido. Inserir aqui na quitação."
