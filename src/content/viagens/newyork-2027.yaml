      - "A ida tem tag **Outlet Clube Smiles**; a volta não. Conferir as regras de remarcação da tarifa outlet antes de mexer em qualquer data."
      - "🚨 **O bilhete parte de GUARULHOS e o grupo está em Goiânia.** Faltam **GYN→GRU** e **GRU→GYN** para seis pessoas — 12 pernas que ainda não existem em lugar nenhum. Decidir entre milhas (doméstico sai barato e o LATAM Pass tem 19.478 paradas), dinheiro ou estrada. **Chegar em GRU na véspera, não no dia:** pousar no mesmo dia do voo das 22h30 com seis pessoas é risco desnecessário, e um atraso no doméstico custaria as 729.000."
      - "Esse trecho entra no rateio também — decidir se vai no mesmo pagamento único ou à parte."
      - "Sem localizador ainda — ele só nasce quando o bilhete for emitido. Inserir aqui na quitação."
  - tipo: ficha
    titulo: "Como as 729.000 milhas serão pagas"
    icone: "💰"
    cartoes:
      - titulo: "De onde vem"
        entradas:
          - { rotulo: "Saldo Smiles hoje", valor: "307.291" }
          - { rotulo: "Clube Smiles · 2.000/mês até março", valor: "12.000" }
          - { rotulo: "Livelo · 33.234 pts numa janela de 80%", valor: "59.821" }
          - { rotulo: "C6 Átomos · 5.381 hoje + ~5.000/mês, 1:1", valor: "~35.000" }
          - { rotulo: "**A comprar**", valor: "**314.888**" }
        total: "729.000 milhas"
      - titulo: "Quanto custa comprar"
        subtitulo: "as 314.888 que faltam"
        entradas:
          - { rotulo: "Rota Livelo · ponto a R$ 22 + 80%", valor: "R$ 3.848 · *melhor caso*" }
          - { rotulo: "Smiles direto · teto de R$ 15,80", valor: "R$ 4.975 · **base**" }
          - { rotulo: "Sem promo · R$ 20 o milheiro", valor: "R$ 6.298 · *pior caso*" }
        total: "Desembolso bruto: ~R$ 8.194"
    notas:
      - "🔑 **A rota mais barata provavelmente não é comprar milha Smiles.** O equilíbrio está em **Livelo a R$ 28,44 o milheiro**: abaixo disso, comprar ponto Livelo e transferir a 80% sai mais em conta. **A ordem importa** — comprar o ponto primeiro e esperar a janela de transferência, nunca o contrário. Ponto Livelo não expira com o Clube ativo."
      - "🟢 **O C6 é a rota mais eficiente que existe aqui:** átomo vai **1:1 para a Smiles**, sem intermediário, e o Clube dá teto de 80% em janela de bônus. No ritmo atual (~5.000/mês em três cartões) são ~35.000 milhas até março — **ou até 63.000 se pegar uma janela de 80%**. Conferir campanha antes de transferir, e transferir perto de março para não perder acúmulo."
      - "🗓️ **Três janelas, com peso diferente:** **novembro (Black Friday) — 50%**, ~157.000 milhas · **janeiro** (aniversário GOL/Smiles, Caixa, Clube Azul) — 30%, ~94.000 · **março** (mês do consumidor) — 20%, ~63.000 e o ajuste final. Não há razão para adiar: o prazo é fixo e as milhas não expiram com Clube ativo."
      - "💡 **Comprar mais barato que R$ 15,80 vira margem do Marcelo, não desconto do rateio** — o preço combinado com os outros quatro está travado. Pelo cenário da rota Livelo, a diferença chega a ~R$ 1.100."
      - "⚠️ **Manter o Clube Livelo ativo até a última transferência** — é ele que impede os pontos de expirar. Isso reverte a inclinação de não renovar em 02/06/2027."
      - "⛔ Gasto que cai na **Esfera/Santander vai para Iberia e LATAM, nunca para a Smiles**. Para esta viagem só duas rotas servem: **C6 Átomos** e **Livelo**."
