    icone: "🏨"
    checklist:
      - "**Nova York** — 8 noites, 31/05 a 08/06/2027 · *a definir bairro e reservar*"
    destaque: "Pendência aberta · seis pessoas, oito noites"
    notas:
      - "**Seis pessoas muda a conta.** Dois ou três quartos de hotel por 8 noites em Manhattan costumam perder feio para um apartamento inteiro. Vale comparar Airbnb/apart-hotel cedo — imóvel bom para 6 em Nova York esgota com antecedência, e 2027 já está abrindo."
      - "São três núcleos (Christopher & Ana Claudia · Luci & Ulisses · Marcelo & Sabrina), o que favorece um apartamento de 3 quartos sobre quartos de hotel separados — e facilita o rateio, que aí sai por casal."
      - "Pontos Esfera dão 5% OFF na Esfera Viagens e o Clube Pro já está pago — vale comparar na hora de reservar. Hotel também costuma acumular direto no programa além do cartão (foi assim que a Localiza rendeu 5.027 milhas de graça em setembro)."
  - tipo: checklist
