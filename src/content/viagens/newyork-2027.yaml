        detalhe: "Virou o item mais urgente agora que o visto saiu da frente. Grafia diferente entre documento brasileiro e canadense trava o check-in, e corrigir nome em bilhete de milhas é caro. Cinco minutos hoje contra dor de cabeça em maio"
