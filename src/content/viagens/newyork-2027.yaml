    notas:
      - "🎫 **Internacional emitido em 17/11/2026** (e-mail da Smiles *Confira os detalhes do seu bilhete*): localizador Smiles **APZHTN**, American **KZTKJR**, voos **AA 950** e **AA 951**, cabine econômica, **tarifa reembolsável**, **1ª mala gratuita** para os seis nos dois sentidos. Assento e check-in são feitos direto com a American."
      - "**Tarifa reembolsável.** Cancelamento custa **US$ 180 por viajante**, cobrado no ato — e as milhas voltam. *(Vale para o internacional.)*"
      - "A ida tem tag **Outlet Clube Smiles**; a volta não. Conferir as regras de remarcação da tarifa outlet antes de mexer em qualquer data."
      - "✅ **Ida GYN→GRU comprada em 14/11/2026** · GOL **G3 1491**, reserva **QKPAFX**, tarifa Light, assentos **GOL+ Conforto** na fileira 1 (Marcelo 1E), 1 mala despachada de 23 kg, **R$ 3.772,92** pelos seis no cartão de crédito (Minhas Viagens da GOL, lido em 18/11). Pousa em Guarulhos às 12h50: **9h40 de folga** antes do American das 22h30."
      - "🎫 **GRU→GYN emitido em 12/10/2026** · GOL **G3 1492**, Boeing 737-800, tarifa **Light**, econômica. Assentos **GOL+ Conforto na fileira 1**: Ana Claudia 01A · Christopher 01B · Luci 01C · Ulisses 01D · Sabrina 01E · Marcelo 01F."
      - "🧳 **A tarifa Light da GOL não leva mala despachada.** Na volta GRU→GYN foi comprada a 1ª bagagem (R$ 175,00) para cinco dos seis — **falta a do Marcelo**. Na ida GYN→GRU a mala despachada de 23 kg já está na reserva (conferido no Marcelo; os demais seguem a mesma compra)."
      - "⏱️ **Folga na volta:** o voo de Nova York pousa em Guarulhos às **06h55** e o da GOL sai às **17h00** do **Terminal 2** — cerca de 10 horas. São **bilhetes separados**: passar pela imigração, retirar as malas e despachar de novo no balcão da GOL."
      - "Os dois trechos domésticos entram no rateio **à parte**: cada um dos quatro devolve o próprio bilhete. A volta **já foi paga** em 10/11/2026 (ver *Rateio*); a ida está lançada em *Gastos*, a receber."
