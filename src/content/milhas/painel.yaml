alertas:
  - "🎫 **RESERVA FEITA — a meta saiu do radar e virou compromisso com prazo.** Viaje Fácil confirmado em *Meus Voos*: **GRU 31/05/27 22h30 → JFK 01/06/27 07h10** e **JFK 07/06/27 20h20 → GRU 08/06/27 06h55**, American, direto, **cabine econômica, 6 passageiros**. **Total a pagar: 729.000 milhas. Emitir até 01/04/2027.** Já desembolsado: **R$ 3.218,94** (taxa de embarque R$ 2.969,04 + serviço Viaje Fácil R$ 249,90). Ao quitar voltam **4.000 milhas de bônus** — cashback depois da emissão, **não ajudam a pagar**"
  - "🔴 **DUAS JANELAS FECHAM ESTA SEMANA, e as duas somam ~58.000 milhas.** **Hoje até 23h59:** C6 Átomos→Smiles a **80%**, que transforma os 5.381 átomos em **9.685 milhas** — cadastro obrigatório na página da campanha ANTES de transferir. **Segunda 28/09 às 21h:** reativação a **330%**. **E até 30/09:** conta Nomad nova rende até **48.000 milhas** na primeira conversão. Juntas, essas três valem cerca de **14% do que falta** — e nenhuma delas depende de Black Friday"
  - "🟢 **O C6 tinha 24 vezes mais do que o painel achava — e isso corta R$ 520 do plano.** O saldo real é **5.381,28 átomos**, não 226; o número velho era print de 31/08. Ritmo de **~5.000/mês** em três cartões, o que dá **~35.000 milhas até março no 1:1** — ou **até 63.000** numa janela de 80%. **O C6 deixa de ser irrelevante e vira a terceira fonte do financiamento**, atrás só da compra e da Livelo. **Lição repetida pela segunda vez esta semana:** print velho não é saldo. Sobrou um só — **LATAM Pass, parado em 20/08**, e é justamente o que tem prazo correndo contra ele"
  - "📐 **O PLANO DE QUITAÇÃO — faltam 421.709 milhas e ~R$ 5,0 mil.** De onde sai cada pedaço: **Clube Smiles** 2.000/mês × 6 = **12.000** (automático) · **Livelo** 33.234 numa janela de 80% = **59.821** · **C6 Átomos** 5.381 + ~5.000/mês = **~35.000** no 1:1 · **restante a COMPRAR: 314.888 milhas**. Custo conforme o canal: **R$ 3.848** pela rota Livelo a R$ 22 + 80% · **R$ 4.975** comprando Smiles direto no teto de R$ 15,80 · **R$ 6.298** no cenário ruim a R$ 20. **Total da viagem somando o que já foi pago: R$ 7.067 a R$ 9.517 — base R$ 8.194, cerca de R$ 1.366 por pessoa.** Em dinheiro essa passagem custaria R$ 4.000 a 6.000 por pessoa"
  - "📅 **Três janelas de compra, e não são equivalentes — front-load na Black Friday.** Pelo calendário da consultoria: **novembro (Black Friday) é a melhor do ano** · **janeiro** traz aniversário de Clube Azul, Caixa e **GOL/Smiles** · **março** é o mês do consumidor. **Divisão sugerida: 50% em novembro (~157.000), 30% em janeiro (~94.000), 20% em março (~63.000).** Não há razão para esperar: as milhas não expiram com Clube ativo e o prazo é fixo, então preço melhor cedo vence preço incerto depois. **Fechar tudo até 15/03/2027**, não 01/04 — o prazo real precisa de folga para transferência e imprevisto"
  - "🔑 **O canal mais barato provavelmente NÃO é comprar milha Smiles.** O ponto de equilíbrio é **Livelo a R$ 28,44 o milheiro**: abaixo disso, comprar Livelo e transferir a 80% sai mais barato que comprar Smiles direto a R$ 15,80. Promo de Black Friday da Livelo costuma pôr o milheiro em R$ 20–25, o que levaria o milheiro Smiles efetivo a **R$ 11 a R$ 14**. **Exige que duas coisas coincidam:** promo de compra Livelo e janela de transferência ≥70%. Como ponto Livelo não expira com Clube ativo, dá para **comprar primeiro e esperar a janela** — a ordem é essa, nunca o contrário. **Setembro deu quatro janelas de 80%; a Livelo→Smiles mais recente fechou em 18/09**"
  - "💳 **Onde colocar o gasto nos próximos seis meses — e agora a resposta ficou mais clara.** Para Nova York só duas rotas chegam na Smiles: **C6 Átomos** (1:1, direto, e provou render ~5.000/mês) e **Livelo** (cartão Bradesco). Gasto que cai na **Esfera/Santander alimenta Iberia e LATAM, não Smiles** — ajuda a frente Europa, não esta reserva. **O C6 é hoje a rota mais eficiente para esta meta**, e isso conflita frontalmente com a migração de rota decidida em 31/08. **Vale reavaliar por seis meses.** Decisão para o dono. ❓ **E uma pergunta concreta: os R$ 3.218,94 da reserva foram em qual cartão?** O final **2360** que aparecia na tela de pagamento da Smiles é um dos cartões que rendem átomos — se foi no Visa 7238, ficaram uns 3.000 a 6.000 átomos na mesa"
  - "🔴 **Reativação Smiles a 330% vence SEGUNDA, 28/09 às 21h — e a pergunta segue sem resposta desde 20/09.** Quanto existe de milhas expiradas na conta? Abrir *Minhas Milhas → Reativar milhas*. A R$ 0,07 por milha, o milheiro fica em **≈ R$ 16,28**. **Com 421.709 milhas faltando e prazo em 01/04, R$ 16,28 deixou de ser caro** — bate o pior cenário de compra (R$ 20). **Prazo mais próximo do painel depois do C6: 3 dias**"
  - "❓ **Verificar: a quitação aceita pagamento parcial?** Se a Smiles permitir abater as 729.000 em parcelas conforme as milhas chegam, o risco do plano cai muito — cada compra vira progresso travado. Se for tudo-ou-nada em 01/04, qualquer atraso de transferência no fim de março derruba a operação inteira. **É a pergunta operacional mais importante em aberto**, e provavelmente está nos Termos do Viaje Fácil"
  - "🛂 **Dependência que não tem nada a ver com milha: passaporte e visto americano para SEIS pessoas.** Levantar agora quem tem visto vigente e passaporte com validade para junho/2027, e quem precisa entrar na fila. Descobrir isso em março, com o bilhete travado, seria o pior momento possível. **Nenhuma milha resolve um visto negado ou uma fila de agendamento**"
  - "✈️ **Buraco que a reserva abriu: o bilhete parte de GUARULHOS e o grupo está em Goiânia.** Faltam **GYN→GRU e GRU→GYN para seis pessoas — 12 trechos que não existem em lugar nenhum.** Decidir entre milhas (doméstico sai barato), dinheiro ou estrada, e **chegar em GRU com folga**: pousar no mesmo dia do voo das 22h30 com seis pessoas é risco desnecessário"
  - "🟢 **Os 22.500 Avios chegam entre 29/09 e 01/10 — e não entram nesta conta.** Transferência Esfera→Iberia de 22/09 (36.000 pts → 18.000 base + 1.800 promo + 2.700 Clube), crédito em até 3 lançamentos no **Iberia Club**. Conferir em *Meus Avios*. Programa separado, não soma nas 729.000 — ficam para a Europa. O Clube Pro se pagou nessa única operação: sem ele seriam 19.800, e os 2.700 de diferença valem ~R$ 148 contra R$ 43,90 de mensalidade"
  - "🔴 **AÇÃO PENDENTE há 10 dias — LATAM Pass.** Clube encerrou em 15/09, as 19.478 milhas voltaram à regra padrão. Já houve perdas por expiração em set/2025 e jan/2026, sempre nesta época. **Abrir o extrato, anotar a nova data de expiração e decidir.** Único saldo do portfólio com prazo correndo contra ele — e o único ainda baseado em print velho"
  - "🟠 **Teste marcado para ~18/10: os 292 pontos a mais.** *Novo Clube 1000* creditou **1.292** e o plano promete 1.000. O e-mail da Esfera de 21/09 fala em *bonificação paga em 12 parcelas mensais*. **Se cair outro ~292 por volta de 18/10, é bônus de adesão parcelado.** Custo do teste: olhar o extrato uma vez"
  - "⚖️ **Conflito de réguas, decisão adiada a pedido.** A consultoria usa **Iberia 20%** e **LATAM 20–25%**; os pisos daqui são **≥ 50%** e **Livelo→LATAM ≥ 30%**. Pisos inalterados, divergência em **/consultoria**. **Nota nova:** a consultoria dizia *manter Clube Livelo* e o painel apontava para não renovar — **o financiamento desta reserva decide a favor de manter**, até a última transferência"
  - "🚫 **O que não toca este portfólio.** Azul até 110% e Azul + ALL Accor (sem conta Azul) · Smiles ↔ Inter Loop 80% (ponta do Inter) · Smiles + KMV 100% (sem saldo) · Clube Smiles e Clube Livelo com bônus de adesão (só novos assinantes) · **Livelo→LATAM 25%** e **Esfera→LATAM 25%** (reprovam nos pisos de 30% e 50%, e LATAM não soma nas 729.000) · **Clube Esfera com até 60.000 pts de adesão até 25/09** (já é Pro desde 18/09) · **Esfera→Iberia até 25%, também até 25/09** — sobraram 158 pts e o mínimo é 20.000; o próximo lote leva de 6 a 10 meses · **Smiles com até 30% OFF em resgate** (bilhete já reservado)"
  - "💡 **Regra ganha em setembro: a Localiza pagou DUAS VEZES pela mesma diária.** Smiles creditou +3.070 e +1.957 (5.027 milhas) e a Esfera ainda deu +23 pelo cartão. **Antes de compra grande em parceiro — locadora, hotel, seguro — checar acúmulo direto no programa além do cartão.** Com 421.709 milhas a levantar, cada achado desses conta"
  - "**Lição de print velho — cobrada duas vezes em dois dias.** O C6 aparecia com 226 átomos e tinha **5.381**; o número era de 31/08. Antes disso, a Esfera carregou uma incógnita de três dias que o extrato resolveu numa linha. **Saldo que não foi lido esta semana não é saldo, é lembrança.** Sobrou um: **LATAM Pass, 20/08**"
  - "**Lição de data prometida — três repetições, virou regra.** *Pontos a receber* da Livelo prometeu 19/09, depois 22/09, agora **29/09**, e o valor caiu de 9.645 para **9.521**. Data e valor pioram juntos. **Não entram em conta de decisão até cair no saldo**"
  - "**Lição de vigência x oferta (24/09):** o painel marcou a promo de 30% da American como AGIR HOJE com vigência certa mas **sem tarifa verificada nas datas da meta**. Não havia nada aplicável. **Vigência confirmada não é oferta confirmada** — e no dia seguinte a tarifa apareceu de verdade, na tela, e era boa"
  - "**Lição de inferência, com desfecho feliz:** por três telas o ano da viagem não apareceu, e o painel se recusou a escrever *2027* como fato mesmo com 31 de maio caindo numa segunda. A tela de *Meus Voos* confirmou. **A dedução estava certa e ainda assim esperar foi barato** — trinta segundos contra gravar premissa como dado numa compra de R$ 3,2 mil"
  - "📝 **Notion desatualizado desde 24/09** — tem o bloco *ESTADO ATUAL*, mas sem a reserva, sem a correção de 6 passageiros, sem o C6 real e sem o plano de quitação. **O painel está à frente do Notion, então os saldos daqui NÃO foram sobrescritos pela leitura do Notion de hoje.** Atualizar o Notion na próxima passagem. A viagem tem página própria com tudo isto: **/viagens/newyork-2027.html**"
