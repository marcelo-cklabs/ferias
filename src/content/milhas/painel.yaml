  - "✅ **LOTE 2 FECHADO E CONFERIDO NO DESTINO — 39.100 milhas, 16.100 delas de bônus, creditadas no mesmo dia.** O e-mail transacional da Smiles traz *Saldo em 28/09: 356.478* = 317.378 + 39.100: base e bônus de **70%** juntos, sem precisar contestar os 40% que a tela da Livelo mostrava. **Faltam 372.522.** Histórico: 🚀 **LOTE 2 EXECUTADO — Livelo→Smiles com 70% de bônus, em 28/09.** Campanha Smiles *bancos 09/2026* (cadastro e transferência das 10h de 28/09 às 23h59 de 29/09; 70% para Clube Smiles, 40% para os demais; bônus até 15/10, válido 12 meses; teto de 300.000 de bônus por CPF). **Participação confirmada ANTES da transferência.** Enviados **23.000 pontos** (pedido Livelo L02067416098635, imediata do Clube). **Esperado: 23.000 de base em até 2h + 16.100 de bônus até 15/10 = 39.100 milhas.** A tela da Livelo mostra *40% aplicado* (+9.200) — é o padrão dela; se o bônus vier a 40% e não a 70%, **contestar com o print do cadastro**. Faltam para NY, depois do crédito: **~372.500**"
