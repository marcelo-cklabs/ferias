  - "✅ **AVIOS FECHADO E CONFERIDO NO DESTINO — 22.500, exatamente o esperado.** Tela do Iberia Club em 02/10: 18.000 de base (22/09) + **4.500 de bônus** (1.800 da promo + 2.700 do Clube Pro) da transferência Esfera→Iberia de 22/09 (36.000 pts). **Sem contestação:** o pedido nº 317871629 não precisa ser acionado. O Clube Pro se pagou nessa única operação: sem ele seriam 19.800, e os 2.700 de diferença valem ~R$ 148 contra R$ 43,90 de mensalidade. Programa separado, não soma nas 729.000 — ficam para a Europa. **Das duas conferências de 29/09–01/10, sobrava uma: os 9.521 pontos a receber da Livelo** — lida em 06/10: saldo 2.875 e 7.363 a receber a partir de 27/10"
  - "✅ **LATAM Pass: a data de expiração apareceu, e não há prazo correndo.** Tela de 07/10: **19.478 milhas** (as mesmas desde 20/08) e o próximo vencimento mostrado é de só **510 milhas em 01/06/2029** — depois das viagens de NY e de Maceió. **Alerta fechado.** Programa terminal e separado, não soma nas 729.000. Histórico: 🔴 **AÇÃO PENDENTE desde 15/09** — o Clube encerrou, as milhas voltaram à regra padrão e já houve perdas por expiração em set/2025 e jan/2026; a data de expiração era o único prazo desconhecido do painel"
  - "✅ **Conta Azul zerada, como o plano previa.** Tela de 07/10: **0 pts**, 0 a vencer; o extrato mostra *Points Expiration* de −587 em 28/09 e −587 em **30/09**. Valiam uns R$ 20 e não pagavam trecho nenhum. **A conta continua existindo** — é nela que sai o direto GYN↔MCZ de setembro/2027, hoje a **86.000 pts por pessoa** (ida + volta, leitura de 06/10). **Alerta fechado.** Histórico: 🟠 conta esquecida, 587 venceram em 28/09 e os outros 587 venceriam a seguir; decisão de deixar vencer, sem pagar para salvar"
  - "✅ **Teste dos 292 fechado em 19/10: o Clube Esfera creditou de novo 1.292 em 18/10** (*Novo Clube 1000*, tela de 19/10). O plano promete 1.000, então **os 292 a mais se repetem todo mês**: é a bonificação de adesão paga em 12 parcelas mensais, como dizia o e-mail de 21/09. Conta prática: **~1.292 pts/mês** de Clube enquanto durarem as parcelas. **Alerta fechado.** Histórico: 🟠 **Teste marcado para ~18/10: os 292 pontos a mais.** 📧 **18/10 às 09h30: e-mail da Esfera *sua mensalidade foi aprovada*** — o Clube Esfera foi cobrado e *seus pontos já constam em seu saldo*, mas o e-mail não diz quantos: **olhar o extrato e ver se vieram 1.000 ou ~1.292**. *Novo Clube 1000* creditou **1.292** e o plano promete 1.000. O e-mail da Esfera de 21/09 fala em *bonificação paga em 12 parcelas mensais*. **Se cair outro ~292 por volta de 18/10, é bônus de adesão parcelado.** Custo do teste: olhar o extrato uma vez"
  - "⚖️ **Conflito de réguas, decisão adiada a pedido.** A consultoria usa **Iberia 20%** e **LATAM 20–25%**; os pisos daqui são **≥ 50%** e **Livelo→LATAM ≥ 30%**. Pisos inalterados, divergência em **/consultoria**. **Nota nova:** a consultoria dizia *manter Clube Livelo* e o painel apontava para não renovar — **o financiamento desta reserva decide a favor de manter**, até a última transferência"
  - "🚫 **O que não toca este portfólio.** Azul + ALL Accor (os pontos Azul agora têm destino: Maceió) · Smiles ↔ Inter Loop 80% (ponta do Inter) · Smiles + KMV 100% (sem saldo) · Clube Smiles e Clube Livelo com bônus de adesão (só novos assinantes) · **Livelo→LATAM 25%** e **Esfera→LATAM 25%** (reprovam nos pisos de 30% e 50%, e LATAM não soma nas 729.000) · **Clube Esfera com até 60.000 pts de adesão até 25/09** (já é Pro desde 18/09) · **Esfera→Iberia até 25%, também até 25/09** — sobraram 158 pts e o mínimo é 20.000 · **Smiles com até 30% OFF em resgate** (bilhete já reservado) · **Reativação Smiles a 330%** — 0 milhas expiradas, não havia o que reativar · **Smiles com até 300% de bônus na compra de milhas para assinantes, até 21h de 05/10** — milheiro de no mínimo **R$ 20**, acima do teto de R$ 15,80 (visto em 04/10) · **Turbo Livelo a R$ 30,38–31,00 o milheiro, até 06/10** — acima do teto de R$ 28,44 (visto em 05/10) · **Livelo→Flying Blue 20%, Livelo→ConnectMiles 50%, ALL Accor até 22% e cartões Azul Itaú/LATAM Itaú com bônus de adesão** (programas fora do portfólio, vistos em 06/10) · **Clube Smiles 2.000 anual com 13.000 de adesão, até 10h de 07/10** (já é assinante) e **Itaú/Credicard→LATAM 25%, até 09/10** (sem saldo na origem, LATAM não soma) (vistos em 07/10) · **Livelo→Azul e C6→Azul a 40%** fecharam em 07/10 sem uso (insumo insuficiente para Maceió) · **Clube Smiles 2.000 com até 37.000 milhas, até 10h de 08/10** (já é assinante) e **Livelo→ConnectMiles 50% até 15/10, Livelo→Flying Blue 20% até 31/10, cartões Azul Itaú até 120.000 pts até 18/10** (fora do portfólio) (vistos em 08/10) · **Smiles com até 375% de bônus na compra de milhas, até 21h de 16/10** — milheiro de no mínimo **R$ 16,84** (só no Clube 20.000; no Plano 2.000 o bônus é 335%), acima do teto de R$ 15,80 · **Livelo com 56% OFF na compra para assinantes do Clube, até 09/10** — R$ 29,88–30,18 o milheiro, acima do teto de R$ 28,44 · **Banestes→Smiles 80%, Banco do Nordeste→Smiles 70% e BNB/Genial→Azul até 100%, até 09/10** (sem saldo na origem) (vistos em 09/10) · **Azul com 15% a 20% OFF no resgate nacional e UAU Caixa→Azul até 100%, até 12/10** (saldo Azul zero, sem UAU) · **Clube Smiles 2.000 com até 37.000 milhas, até 10h de 13/10** (já é assinante) · **Hilton Honors com até 120% na compra, até 21/11** (fora do portfólio) (vistos em 12/10) · **Smiles: presentear milhas a R$ 20 e transferência entre contas a partir de R$ 28 o milheiro, até 21h de 30/10** (acima do teto de R$ 15,80) e **reativação até 250%, até 21h de 13/10** (0 milhas expiradas) (vistos em 13/10) · **Itaú, Sicredi e Banestes→Azul até 100%, até 14 a 16/10** (sem saldo na origem) e **Azul com 15% OFF no resgate nacional com cupom Sicredi/Banestes, até 15 e 16/10** (viagens só até 31/05/2027, não alcança Maceió) (vistos em 14/10) · **Banco BV→Azul até 100%, até 19/10** (sem saldo na origem) · **Clube Smiles 1.000 com 15.000 milhas na adesão, até 10h de 16/10** (promo de adesão; o dono já é assinante — o caminho é regularizar o Plano 2.000) · **Clube Esfera com até 300% na adesão, até 16/10** (já é Pro) · **C6→LATAM 25% e LATAM Pass→ALL Accor até 20%, até 16/10** (reprova no piso, LATAM não soma) (vistos em 16/10) · **Smiles com até 315% de bônus na compra de milhas para assinantes** (bônus abaixo dos 375% de 16/10, que já punham o milheiro em no mínimo R$ 16,84 — acima do teto de R$ 15,80) · **Cartões Azul Itaú com até 20% OFF no resgate nacional, até 18/10** (sem cartão Azul Itaú) · **Livelo→Flying Blue 20% até 31/10** (fora do portfólio) (vistos em 17/10) · **Itaú→Smiles até 70%, até 23h59 de 20/10** (sem saldo Itaú na origem) · **Clube Smiles 1.000 anual com 14.000 milhas na adesão, até 10h de 20/10** (já é assinante) · **Inter Loop→Azul até 100% e Inter Loop + dinheiro→Azul, UAU Caixa→Azul até 100%** (sem saldo na origem) · **Nomad com 10.000 a 15.000 pts Azul na conta nova, até 19/10** (venceu) · **cartões LATAM Pass Itaú com até 10.000 milhas** (sem cartão, LATAM não soma) (vist