alertas:
  - "🟢 **O print da Esfera muda a conta da meta: 36.158 pts, e a 30% o saldo FECHA um trecho inteiro em Avios.** O saldo subiu **+3.602** desde 31/08. Novo efeito no aniversário de terça: **18.079 Avios** sem bônus, **21.694** a 20% e **23.502** a 30%. Como o GRU→JFK em metal American via Finnair Plus custa **~23.000 Avios/trecho**, o cenário de 30% deixou de ser *quase* e passou a **cobrir um trecho completo, com ~500 Avios de folga** — no saldo de 31/08 parava em 21.161 e não fechava. A 20% ainda faltam ~1.300. O mínimo de transferência do plano Pro (20.000 pts) já está coberto e a taxa é zero. **Conferir o saldo de novo na terça de manhã** — o mês ainda pode creditar antes da campanha abrir"
  - "✅ **Reconciliação da Esfera FECHADA — 39 lançamentos, diferença zero, e a história que eles contam.** O extrato de setembro foi conferido linha a linha: 32.556 + 3.602 = 36.158, sem sobras. Dos 3.602, **1.292 vieram do Clube** (18/09) e **2.310 do cartão Unique Mastercard BL**. **O padrão dos estabelecimentos é a viagem ao Nordeste**: Posto da Lagosta, Supermercado Porto do…, Muro Alto Bistro, JrMaragogi, Amado Camarão, Localiza, entre 03 e 15/09. Não foram três restaurantes soltos — **foi a viagem inteira paga no Santander**, e é isso que valida na prática a mudança de rota de 31/08. Por data: 03/09 **289** · 04/09 **50** · 06/09 **519** · 09/09 **615** · 11/09 **294** · 12/09 **90** · 15/09 **453** · 18/09 **1.292** (Clube). **Ponta solta menor:** o lançamento *Novo Clube 1000* creditou **1.292**, mas o card do Clube reconhece só **1.000** — os **292** de diferença continuam sem explicação na tela"
  - "⚠️ **A ressalva que o extrato impõe: a Esfera vira fluxo, mas um fluxo LENTO.** Setembro rendeu 2.310 pts de cartão — e foi um mês **com viagem**, portanto acima do normal. Somando o Clube, o ritmo fica em algo entre **2.000 e 3.300 pts/mês** em mês comum. Como o plano Pro só transfere **a partir de 20.000 pts**, cada novo lote transferível leva de **6 a 10 meses** a formar. **Isso qualifica a tese de 31/08** (*com o Santander alimentando a Esfera, a rota Avios deixa de ser recurso escasso e vira fluxo*): vira fluxo, sim, mas na cadência de **um a dois lotes por ano**, não de uma torneira aberta. Consequência prática: se transferir tudo na terça, a Esfera zera e **a próxima janela de transferência só chega em 2027** — o que reforça transferir **no melhor bônus disponível**, não no primeiro que aparecer"
  - "🔴 **AÇÃO PENDENTE — LATAM Pass: o clube encerrou em 15/09, há 5 dias.** As 19.478 milhas perderam a validade de 3 anos garantida pela assinatura e voltaram à regra padrão. Já houve perdas por expiração em set/2025 (-3.723 e -442) e jan/2026 (-3.500), sempre nesta época do ano. **Abrir o extrato, anotar a nova data de expiração e decidir se vale queimar num trecho doméstico barato.** Continua sendo o único item do painel com prazo correndo contra o saldo"
  - "📅 **Aniversário da Esfera na terça, 22/09 — faltam 2 dias e a varredura de hoje ainda não encontrou a campanha no ar.** As páginas oficiais de aniversário listam apenas Azul (até hoje), TAP (até 29/09) e Copa (até 30/09); **nenhuma menção a Iberia Club até agora**. Precedente que sustenta a espera: em 2025 a campanha *Esfera → Iberia Club* rodou de **22 a 24/09**, com **30% para assinantes do Clube Esfera e 20% para os demais**, teto de 1.000.000 pts por CPF e bônus creditado em até 7 dias úteis após o fim. O print de hoje reforça o lado do assinante: **condições exclusivas em campanhas** aparece como benefício explícito do plano Pro. **Ressalva honesta:** aniversário de programa não garante campanha — os calendários do setor tratam a data como *provável*, não certa. **Monitorar terça de manhã e agir na abertura**"
  - "✅ **Confirmado no extrato: o gasto ESTÁ indo no Santander** — 38 dos 39 lançamentos de setembro são do **Cartão Unique Mastercard BL**, com expiração em 2029. Continua de pé a pergunta do outro lado: **o que foram os +21.306 da Fidelidade Bradesco em 10/09**, já que os dois cartões renderam no mesmo mês. Hipótese a testar na próxima fatura: o crédito do Bradesco pode ser de ciclos anteriores, não de gasto corrente — se for, a migração está mais limpa do que o alerta original sugeria"
  - "🟠 **CORREÇÃO do painel de ontem — o bônus do Clube Esfera vale TAMBÉM para upgrade, e o prazo é HOJE, 20/09.** O alerta de ontem colocou as ofertas de clube no balaio de *só novas adesões*; isso está certo para Livelo e Smiles, mas **errado para a Esfera**: a campanha de aniversário publicada em 14/09 aceita **adesão ou atualização imediata** (a *atualização programada* não vale) e paga **350% no Pro, 400% no Master, 450% no VIP e 500% no Exclusive**, em 12 parcelas mensais. Preços de tabela: Pro R$ 43,90, Master R$ 106,90, VIP R$ 211,90 e Exclusive R$ 799,90 por mês. **Mesmo assim o upgrade REPROVA na régua** — e é por isso que não virou oportunidade: no Master o pacote sai a ~R$ 32/milheiro Esfera, no VIP ~R$ 31 e no Exclusive ~R$ 28; como a Iberia converte a **2:1**, o Avios custa de fato **R$ 56 a R$ 64 o milheiro**. Um trecho GRU→JFK a 23k Avios sai por **R$ 1.300–1.470**, contra **~R$ 1.040** do mesmo trecho via Smiles a 65k e R$ 16/milheiro. **O caminho mais barato para a meta continua sendo o pipeline Smiles, não comprar Esfera cara.** Some-se o compromisso de 12 meses, que colide com a régua de saída do Pro. **Se ainda assim quiser subir de plano, a janela fecha hoje**"
  - "⚪ **Esfera → Azul Fidelidade, até 110%, morre hoje — reprovada pela terceira vez.** Maior bônus vivo no radar e o único que aceita o saldo Esfera, mas expira **dois dias antes** do aniversário. Recusada pelos mesmos dois motivos de sempre: a Azul **não serve a meta** (sem malha para Nova York em econômica com saver) e transferir esvaziaria justamente o pool reservado para a Iberia — que, com o saldo de hoje, está a um bônus de 30% de fechar um trecho inteiro. Pior ainda à luz do ritmo de acúmulo: esvaziar agora custaria **6 a 10 meses** para reconstituir o mínimo de transferência. **Bônus grande na moeda errada continua sendo bônus errado** — depois de hoje o assunto sai do painel"
  - "🔴 **Livelo → Smiles 80%: encerramento CONFIRMADO na fonte oficial.** A página da campanha (*Clube Smiles Day · bancos-livelo-09-2026*) foi lida hoje e traz a vigência literal — **das 10h de 17/09 às 23h59 de 18/09**, com o texto *promoção encerrada*. Fim da dúvida levantada pela regra de 28/08 (*manchete de blog não é prazo*): desta vez o regulamento confirma o blog. Foram **três janelas de 80% em quatro dias** com os 23.236 pts parados, que virariam ≈ **41.800 milhas**. **A providência segue a mesma:** o briefing da manhã não alcança campanha que abre à tarde e morre à meia-noite — ou se cadastra no momento em que o e-mail chega, ou a ponta Livelo não entra na conta da meta"
  - "🟢 **Clube Esfera plano Pro — assinatura confirmada em tela em 20/09:** *Ativo*, assinante desde **18/09/2026**, 1.000 pts/mês, última mensalidade de **R$ 43,90 paga em 18/09**. O que se comprou foi a **condição de assinante 4 dias antes do aniversário**, que é exatamente o que a campanha da Iberia exige. A tela também mostra o **1º aniversário de Clube em 11 meses** (compra de pontos passa de 20% para 50% off, catálogo de 10% para 15%, viagens de 5% para 10%) — um argumento de permanência, não de upgrade. **Régua de saída mantida:** reavaliar assim que o bônus da Iberia creditar (~início de outubro); 12 meses seguidos custam R$ 526,80 por 12.000 pts"
  - "🔵 **Esfera → TAP Miles&Go até 29/09 — alternativa de Europa, atrás do Avios.** Com o Clube assinado a paridade cai de 2,2 para **1,8 pontos = 1 milha**: os 36.158 pts dão ≈ **20.088 milhas TAP**, acima dos 18.079 Avios que a Iberia entrega sem bônus. **Mesmo assim perde para a meta ativa** — milha TAP não é Avios, a malha é Europa via Lisboa e a rota Avios emite o **direto GRU→JFK** em metal American por ~23k/trecho, que o cenário de 30% agora cobre. O prazo 29/09 é **posterior ao dia 22**: dá para esperar a oferta da Iberia sem perder esta porta"
  - "⚪ **Esfera → ConnectMiles (Copa), 55% até 30/09 — segue reprovado.** Paridade de **3 pontos = 1 milha** contra o **2:1** da Iberia: os 36.158 pts viram ≈ 18.682 milhas Copa com bônus cheio, praticamente o mesmo que os 18.079 Avios **sem bônus nenhum**. No uso é pior: conexão obrigatória no **Panamá** e a partir de 25.000/trecho para os EUA em econômica. Prazo posterior ao dia 22. Sem ação"
  - "🔵 **Iberia Club com até 20% de desconto no resgate — o calendário não fecha.** Campanha de 18/09: **reservas só até 23/09**, voos até **18/03/2027**, com 20% off justamente em Madri ↔ Nova York. Parece feita para a meta, mas **não dá para usar**: os Avios só existem depois da transferência do dia 22, cujo bônus credita em até 7 dias úteis — o prazo de reserva morre antes. E a rota é **via Madri**, não o direto GRU→JFK em metal American que a meta persegue. **Sem ação — serve de aviso de que a Iberia roda desconto de resgate com frequência; pesquisar de novo assim que os Avios estiverem em conta**"
  - "✈️ **Viagem ao Nordeste encerrada — REC → GYN voou em 12/09/2026** (115.600 milhas, 2 pax). O extrato da Esfera agora mostra o **outro lado da viagem**: o consumo em terra virou ~2.000 pts no Santander. **Ação pendente:** localizar no extrato Smiles o lançamento da bagagem e fechar de vez o alerta das 14.400"
  - "🔄 **Mudança de rota (31/08): o gasto principal migra do Bradesco para o Santander**, alimentando a Esfera; o C6 vira a frente da Sabrina. Duas frentes paralelas: Esfera → Iberia/LATAM (Europa e Executiva) e Átomos → Smiles (EUA e América do Sul). **Agora com evidência completa no extrato** — e com a cadência real medida (ver alerta acima). A definir: condição de isenção da anuidade Santander Unlimited (R$ 2.200/ano), destino do Bradesco Infinite e se o Clube Livelo (R$ 538/ano) será renovado em 02/06/2027 — decisão que convive com os R$ 526,80/ano do Clube Esfera se o Pro for mantido"
  - "❓ **Duas linhas *Convertidos — Shopping Livelo* em 24/08** (26.178 e 52.356, obs. *equivalente ao valor pago em dinheiro*) — sem sinal de mais ou menos e sem efeito no saldo. Abrir o detalhe para entender o que são"
  - "🚫 **Clube Livelo *até 25 mil pontos*, Clube Livelo Special *até 50 mil* e Clube Smiles *até 37 mil milhas*: não se aplicam** — todas restritas a **novas adesões** e o Marcelo já assina os dois planos. O Clube Smiles rodou uma oferta de 17 a 21/09 (até 264 mil milhas no plano 20.000) que também é só para novos assinantes. **A exceção é a Esfera**, que aceita upgrade — ver alerta acima"
  - "📝 **Fonte da verdade desatualizada — 20 dias.** A página *Viagens e Milhas* no Notion foi lida nesta execução e continua sem edição desde **31/08**, ainda com Livelo 630, Smiles 314.664 e **Esfera 32.556**. Os saldos deste painel vêm dos briefings de 11–20/09 e da **reconciliação da Esfera de hoje**, mais novos e conferidos — por isso **não** foram revertidos para os do Notion. Os **pisos batem** entre as duas fontes. **Atualizar o Notion** com os saldos, a assinatura do Clube Esfera, a cadência de acúmulo medida e o encerramento do Clube LATAM"
  - "**Lição de leitura de saldo:** um saldo menor que o esperado nem sempre é erro do programa. Antes de montar contestação, checar os gastos avulsos do próprio período — bagagem, assento, upgrade — que saem do saldo sem aparecer como *resgate*. E, do outro lado, um saldo que *parece* não fechar costuma fechar quando se lê o extrato inteiro em vez da primeira dobra"
  - "**Lição de comparação de clube:** milheiro não decide sozinho. **Comparar sempre milheiro + desembolso total + reversibilidade** — e converter o custo até a moeda que vai emitir o bilhete: um ponto barato que só vira milha a 2:1 pode custar mais por trecho que uma milha aparentemente cara"
