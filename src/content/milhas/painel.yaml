oportunidades:
  - titulo: "Reativação de milhas Smiles"
    bonus: "330% no Clube Plano 2.000 (até 350%)"
    prazo: "28/09 às 21h"
    detalhe: "**Vigência reconferida hoje na página oficial:** das **10h de 14/09 às 21h de 28/09**. A escada é 320% de base mais o adicional do plano — **Plano 2.000 = 330%**, e os 350% do topo são do Plano 20.000 e das categorias Diamante/Magno. Exige Clube ativo, mínimo de 100 milhas, vale para milhas expiradas a partir de 2011, milhas bônus valem 12 meses. A R$ 0,07 por milha reativada, 330% põe o milheiro efetivo em **≈ R$ 16,28** — a consultoria do Matheus usa alvo de **R$ 15,80** para a Smiles, então fica ligeiramente acima da régua dele e praticamente no alvo antigo de R$ 16. Precedente: a reativação de 01/06 pegou 320% a R$ 16,67 e se pagou no voo REC→GYN. **A confirmar antes de agir:** quanto existe de milhas expiradas hoje — abrir **Minhas Milhas → Reativar milhas**. **Mudou o contexto:** com a ida de abril/27 a 57k na mesa, uma emissão finalmente está identificada — mas o pool de 307.291 já cobre ida e volta do casal se a volta sair em econômica. **Reativar só se a volta aparecer cara.** Restam 4 dias."
    url: "https://www.smiles.com.br/portal/campanhas/reativacao-350-20260914"
    recomendacao: "MONITORAR"
  - titulo: "Travar a ida GRU→JFK de 06/04/2027 pelo Viaje Fácil"
    prazo: "sem prazo de campanha — prazo é o assento"
    detalhe: "Não é promoção: é a jogada que a consultoria destravou. A ida **GRU 22h30 → JFK 07h10, direto, American, econômica, 57.000 milhas/viajante** (114.000 o casal) aprova com folga na régua de ≤ 75k e fica abaixo do benchmark saver. O **Viaje Fácil** reserva agora e deixa quitar **até 60 dias antes do voo**. **Custo conferido na página oficial:** taxa de conveniência de **R$ 249,90**, paga na hora e **NÃO reembolsável** se a compra não for concluída — a taxa de embarque também sai na hora, mas essa volta. **Concluindo a compra, assinante do Clube recebe 4.000 milhas bônus** (2.000 para os demais), o que derruba bastante o custo líquido. Limite de **2 reservas simultâneas**, até 9 passageiros cada. ⚠️ **Não entra em débito automático; quitar manualmente.** **Por que entra como oportunidade:** o gargalo da meta nunca foi milha, foi **2 assentos saver na mesma data**, e esta é a primeira vez que um deles aparece confirmado. **A conferir na tela:** se os 2 assentos ainda existem em 06/04 e o que há de volta em **econômica** entre 13 e 20/04. **Se a volta em econômica não aparecer, travar só a ida é uma aposta de R$ 249,90 a fundo perdido — decidir isso antes de pagar.**"
