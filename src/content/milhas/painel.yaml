alertas:
  - "🔴 **LATAM Pass — o clube encerra HOJE, 15/09.** Com o fim da assinatura as 19.478 milhas voltam à regra padrão de validade e perdem os 3 anos garantidos pelo clube. Já houve perdas por expiração (-3.723 e -442 em set/2025, -3.500 em jan/2026). **Ação para amanhã, 16/09:** abrir o extrato, anotar a nova data de expiração e decidir se vale queimar num trecho doméstico barato"
  - "🟠 **Corrige o alerta de 14/09: a promo de 80% Livelo → Smiles EXISTE hoje.** É o **Clube Smiles Day**, campanha `clubesmiles-day/bancos-09-2026`, com vigência declarada no regulamento de **14/09 às 10h00 até 15/09 às 23h59**. Clube Smiles, Diamante ou Magno pegam **80%**; os demais, 50%. **Cadastro prévio obrigatório** antes de transferir. Teto de 300.000 milhas bônus por CPF. A regra de 14/09 segue valendo — página fixa de parceiro ≠ campanha vigente —, mas desta vez a cláusula de vigência confere"
  - "📈 **+21.306 pontos da Fidelidade Bradesco em 10/09 — o maior crédito do ano, e ele contradiz o diagnóstico de 31/08.** Aquele log concluiu que o gasto não estava indo no Bradesco (só Uber desde 07/08); uma fatura que rende 21,3 mil pontos diz o contrário. **Confirmar a origem** (fatura gorda, acúmulo de ciclos ou campanha de bônus) — é a resposta que decide se a **mudança de rota Bradesco → Santander** de 31/08 continua de pé"
  - "🟡 **Smiles subiu 5.027 milhas entre 14 e 15/09** (300.264 → 305.291) e a **categoria virou Prata**. Dois e-mails transacionais de acúmulo chegaram na manhã de 15/09. Conferir no extrato o que creditou — e lembrar que o teto de 80% vem do Clube Plano 2.000, que segue ativo"
  - "✈️ **Viagem ao Nordeste encerrada — REC → GYN voou em 12/09/2026** (115.600 milhas, 2 pax, tarifa turbinada com bagagem), emissão já paga e confirmada. **Ação pendente:** abrir o extrato Smiles, localizar o lançamento da bagagem e fechar de vez o alerta das 14.400"
  - "📅 **Aniversário da Esfera em 22/09 é a próxima data a vigiar — faltam 7 dias.** Em 2025 a casa ofereceu **até 30% de bônus em transferências para o Iberia Club** na mesma janela — é exatamente o gatilho da rota Avios. Não é promessa, é data histórica: monitorar a partir do dia 20. **É por isso que a Esfera não entra no bônus de 80% de hoje**"
  - "✅ **Livelo: crédito conferido e fechado.** O saldo saiu de 630 para **23.236 pts**, com a composição batendo linha a linha no extrato de 14/09. Pendência de 31/08 encerrada · **próximo lote: 9.635 a partir de 19/09** — esses não chegam a tempo do bônus de hoje"
  - "🔄 **Mudança de rota (31/08): o gasto principal migra do Bradesco para o Santander**, alimentando a Esfera; o C6 vira a frente da Sabrina. Duas frentes paralelas: Esfera → Iberia/LATAM (Europa e Executiva) e Átomos → Smiles (EUA e América do Sul). A definir: condição de isenção da anuidade Santander Unlimited (R$ 2.200/ano), destino do Bradesco Infinite e se o Clube Livelo (R$ 538/ano) será renovado em 02/06/2027"
  - "❓ **Duas linhas *Convertidos — Shopping Livelo* em 24/08** (26.178 e 52.356, obs. *equivalente ao valor pago em dinheiro*) — sem sinal de mais ou menos e sem efeito no saldo. Abrir o detalhe para entender o que são"
  - "🟠 **Clube Esfera volta à mesa numa versão melhor que as reprovadas.** A janela do *Mês do Cliente* (60 mil pontos, milheiro a R$ 32,00–37,62) fechou em 11/09 e foi recusada três vezes. A oferta de agora é **até 100.000 pontos em 12 meses** com milheiro a partir de **R$ 25,40** no Exclusive anual à vista — ainda caro no 2:1 da Iberia (~R$ 51/milheiro de Avios), mas é o melhor número até aqui. Segue a pendência de 31/08: **confirmar se o Clube eleva o teto de bônus em transferências**"
  - "🚫 **Clube Livelo *até 25 mil pontos* (prorrogado até 22/09, bônus Elo até 30/09): não se aplica.** O regulamento limita a oferta a **novas adesões** do Classic Flex anual — o Marcelo já é assinante do Classic Anual até 02/06/2027. Mesma coisa com o *até 37 mil milhas* do Clube Smiles 2.000, que ele já assina. Nenhum dos dois entra como oportunidade"
  - "**Lição de leitura de saldo:** um saldo menor que o esperado nem sempre é erro do programa. Antes de montar contestação, checar os gastos avulsos do próprio período — bagagem, assento, upgrade — que saem do saldo sem aparecer como *resgate*"
