alertas:
  - "🟢 **RESPOSTA À PERGUNTA DO DIA: o bônus da Esfera existe, mas ele não cai na Esfera — cai no Iberia Club.** O e-mail da campanha, de 21/09, é literal: *Crédito total da bonificação no Iberia Club em até 7 dias, em até 3 lançamentos: **pontos base, bônus promocional e +15% extra para membros do Clube Esfera***. Ou seja, a estrutura dos 25% é **10% de promoção + 15% de Clube** — e o extrato da Esfera, por construção, só mostra a saída de −36.000. **A conta esperada na conta Iberia:** 36.000 ÷ 2 = **18.000 Avios base** · +10% = **1.800** · +15% de Clube = **2.700** · total **22.500 Avios**. **Prazo:** até 7 dias após o fim da campanha (22/09) → entre **29/09 e 01/10**. **Não está atrasado.** Conferir em *Meus Avios* no Iberia Club, não no extrato da Esfera"
  - "🟢 **O Clube Esfera Pro se pagou na primeira transferência — e por uma via que não era a esperada.** Sem a assinatura de 18/09, esta operação teria rendido só os 10% de promoção: **19.800 Avios**. Com o Clube, são **22.500**. A diferença de **2.700 Avios** vale, pela régua do próprio Matheus (Avios a até R$ 55/milheiro), cerca de **R$ 148** — contra R$ 43,90 de mensalidade. E o *Transferência Expressa Grátis* que aparece no extrato é outro benefício do plano. **A tese de que o Pro se justifica como chave de bônus, não como pacote de pontos, está confirmada em dinheiro**"
  - "🟡 **CORREÇÃO DO PRÓPRIO PAINEL: a promoção da American de hoje não se materializou na tela.** De manhã este painel marcou *até 30% OFF em todas as passagens American Airlines* como **AGIR HOJE**, com prazo às 10h. A vigência estava certa — a página oficial da campanha (*csday-passagens-140926*) confirma das 15h de 21/09 às 10h de 24/09, exclusiva para assinantes Clube. **O que estava errado era o salto seguinte:** o painel extrapolou o desconto sobre o *benchmark saver* GRU→JFK sem uma tarifa verificada nas datas da meta, e marcou AGIR HOJE em cima dessa extrapolação. Marcelo foi buscar e **não achou nada aplicável antes das 10h**. **Regra nova, na mesma família do *manchete de blog não é prazo*: vigência confirmada não é oferta confirmada.** Desconto de resgate só vira AGIR HOJE com **tarifa vista na tela, na rota e nas datas da meta** — até lá é MONITORAR. A régua de % serve para transferência; para resgate, o que decide é o preço do bilhete"
  - "📋 **A consultoria do Matheus entrou no portal — e trouxe a melhor notícia da semana sobre a meta.** O PDF *Estratégia Marcelo* (contratado em 23/09, lançamento *MP MILHASCOMMATHEUS +324* no extrato Esfera) está transcrito em **/consultoria**, ligado a partir daqui. O achado central: ele encontrou **GRU→JFK direto, American, econômica, a 57.000 milhas/viajante em 6 de abril de 2027** — marcado *Menor preço · Recomendado · Outlet Clube Smiles*. **57k aprova com folga na régua de ≤ 75k e fica abaixo do próprio benchmark saver de 59,4k.** É a primeira evidência concreta de que **abril/27 tem assento saver de verdade**, enquanto março/27 segue seco. **A volta que ele achou reprova:** 13 de abril, direto, mas em **premium economy a 121.700/viajante** — o casal fecharia em 357.400, acima do pool. **O que sobra de trabalho é caçar a volta em econômica**"
  - "🔑 **Viaje Fácil: a ferramenta que ataca o gargalo real da meta — conferido hoje na página oficial.** Reserva a passagem agora e permite quitar **até 60 dias antes do voo**. **Taxa de conveniência R$ 249,90**, paga na hora no cartão e **NÃO reembolsável** se a compra não for concluída; a taxa de embarque também sai na hora, mas essa volta. **Se a compra for concluída, assinante do Clube recebe 4.000 milhas bônus** (2.000 para os demais) — o custo líquido real fica bem abaixo dos R$ 250. Limite de **2 reservas simultâneas**, até 9 passageiros por reserva. ⚠️ **Não entra em débito automático — quitar manualmente.** Por que importa: o gargalo da meta nunca foi milha, foi **2 assentos saver na mesma data**. Permite **travar a ida de 06/04/27 a 57k assim que ela aparecer** e caçar a volta em econômica depois. **É o item mais acionável do momento — e o prazo não é de campanha, é de assento**"
  - "⚖️ **Conflito de réguas registrado, e nada foi mudado.** A consultoria diz que **Iberia a 20% já é bom** e **LATAM a 20–25% já é bom**; os pisos deste radar são **Esfera→Iberia/LATAM ≥ 50%** e **Livelo→LATAM ≥ 30%**. Pelo piso do Matheus, a campanha Esfera→Iberia de 22/09 (25%) e a Esfera→LATAM desta semana (25%) seriam **oportunidades**; pelo piso do radar, as duas **reprovam** — e a de Iberia acabou sendo feita mesmo assim, por exceção de meta. **Isso é um sintoma:** um piso que a operação real contorna por exceção toda vez provavelmente está calibrado errado. **Decisão adiada a pedido** — os pisos seguem vindo do Notion, e a divergência está documentada em **/consultoria**. Segundo conflito, menor: a consultoria diz *manter Clube Livelo*; o painel aponta para não renovar em 02/06/2027. Ela não sabia da migração de rota de 31/08"
  - "🟠 **Esfera → LATAM Pass com 25% de bônus está no ar — e reprova no piso vigente.** Piso da rota: 50%. Além disso, o ponto agora é acadêmico: **a Esfera foi a 158 pontos provados** com a transferência de 22/09. Não há saldo para transferir para lugar nenhum. **Sem ação**"
  - "🔴 **A campanha Esfera → Iberia Club morreu em 22/09 às 23h59 — e a próxima é uma incógnita.** Confirmado em duas fontes independentes: 25% para assinantes do Clube Esfera, 10% para os demais. A transferência entrou **dentro** da janela, às 12h25. A má notícia é a cadência: setembro rendeu ~2.310 pts de cartão num mês **com viagem**, e somando o Clube o ritmo fica em **2.000 a 3.300 pts/mês**. Como o plano Pro só transfere **a partir de 20.000 pts**, o próximo lote leva de **6 a 10 meses** a se formar. **A próxima janela útil da Esfera só chega em 2027** — e o aniversário do Clube Esfera, que a consultoria aponta como melhor época, é em **maio**"
  - "🔵 **Esfera → TAP Miles&Go (até 29/09) e Esfera → ConnectMiles/Copa 55% (até 30/09): encerradas na prática.** Dependiam do mesmo saldo, que agora é 158. Ficam só para fechar a comparação: a TAP entregaria ≈ 20.088 milhas na paridade de assinante (1,8:1) e a Copa ≈ 18.682 com bônus cheio (3:1) — **as duas já perdiam para o 2:1 da Iberia antes do bônus**. A escolha da Iberia era a certa"
  - "🟠 **Clube Esfera em campanha até 25/09 — segue reprovando como pacote de pontos.** Adesão ou upgrade com bônus por plano: 2.000 pts no Pro (R$ 43,90/mês), 5.000 no Master (R$ 106,90), 15.000 no VIP (R$ 211,90), 60.000 no Exclusive (R$ 799,90). O milheiro Esfera sai entre **R$ 28,79 e R$ 37,63**, e como a Iberia converte a 2:1 o **Avios sai de fato a R$ 56–64 o milheiro** — acima do teto de R$ 55 da própria consultoria. **Como pacote de pontos, não.** Como chave de bônus, o Pro já provou seu valor hoje (ver alerta acima). **Pendência aberta:** o e-mail de 21/09 traz a nota *bonificação paga em 12 parcelas mensais* — se o Pro assinado em 18/09 tem bônus de adesão parcelado, ele explicaria os **292 pontos a mais** do lançamento *Novo Clube 1000* (+1.292 em vez de 1.000). **Teste barato: se cair outro ~292 por volta de 18/10, a hipótese se confirma**"
  - "🔴 **AÇÃO PENDENTE — LATAM Pass: o clube encerrou em 15/09, há 9 dias.** As 19.478 milhas perderam a validade de 3 anos garantida pela assinatura e voltaram à regra padrão. Já houve perdas por expiração em set/2025 (-3.723 e -442) e jan/2026 (-3.500), sempre nesta época do ano. **Abrir o extrato, anotar a nova data de expiração e decidir se vale queimar num trecho doméstico barato.** É o item mais antigo em aberto do painel e o único com prazo correndo contra o saldo"
  - "🚫 **Promoções vistosas da semana que não tocam este portfólio.** **Azul até 110%** (inclui Livelo e Esfera) e **Azul + ALL Accor 30%** — não há conta Azul. **Smiles ↔ Inter Loop 80%** — a ponta é do Inter. **Smiles + KMV 100%** — não há saldo de Km de Vantagens. **Clube Livelo *até 157 mil pontos em 1 ano*, milheiro a partir de R$ 19,39** — bom no papel, mas a rota de acúmulo migrou para Santander/Esfera e a decisão provável é não renovar. **Nenhuma entra no painel**"
  - "💡 **Achado de otimização: a Localiza pagou DUAS VEZES pela mesma diária.** Em 15/09 a Smiles creditou **+3.070** (*Acumulo Localiza Clube Smiles*) e **+1.957** (*Localiza Coberturas Acúmulo Clube Smiles*) — **5.027 milhas**, ambas com a estrela de bônus do Clube. No mesmo aluguel, o extrato da Esfera registra **LOCALIZA RAC ACCGR20 +23 pts** pelo cartão Santander. **Regra prática:** antes de qualquer compra grande em parceiro (locadora, hotel, seguro), checar se há acúmulo direto Smiles além do cartão. As 5.027 milhas saíram de graça de uma diária que já ia ser paga"
  - "✅ **Quatro dos cinco programas agora reconciliados.** **Smiles:** 314.664 − 14.400 + 7.027 = 307.291 (20/09). **Livelo:** 630 + 1.000 + 300 + 21.306 + 202 = 23.438 (20/09). **Esfera:** 36.158 (20/09) − 36.000 (22/09) = **158**, fechado hoje com o print do extrato. **Faltam C6 (print de 31/08) e LATAM Pass (print de 20/08).** **Ponta solta menor:** o lançamento *Novo Clube 1000* creditou 1.292 e o card do Clube reconhece 1.000 — os **292** ganharam uma hipótese testável hoje, ver alerta do Clube Esfera"
  - "✅ **Confirmado nos extratos: as duas frentes estão rendendo ao mesmo tempo.** Na Esfera, os lançamentos de setembro são quase todos do **Cartão Unique Mastercard BL** — o gasto corrente migrou mesmo, exatamente como a consultoria recomenda (*centralizar os gastos seus e da Sabrina no Unlimited*). Na Livelo, o rótulo do crédito de 10/09 é **Fidelidade Bradesco**, +21.306 num lançamento único. Hipótese a testar na próxima fatura: se for acúmulo de ciclos anteriores e não gasto corrente, a migração está mais limpa do que o alerta original sugeria"
  - "🔄 **Mudança de rota (31/08): o gasto principal migra do Bradesco para o Santander**, alimentando a Esfera; o C6 vira a frente da Sabrina. Duas frentes paralelas: Esfera → Iberia/LATAM (Europa e Executiva) e Átomos → Smiles (EUA e América do Sul). A definir: condição de isenção da anuidade Santander Unlimited (R$ 2.200/ano — a consultoria lembra que **salas VIP ilimitadas exigem média de R$ 10 mil nas últimas 3 faturas**), destino do Bradesco Infinite e a renovação do Clube Livelo em 02/06/2027"
  - "🚫 **Ofertas de clube restritas a novas adesões não se aplicam.** Clube Livelo *até 25 mil pontos*, Livelo Special *até 50 mil* e Clube Smiles *até 37 mil milhas* — Marcelo já assina os dois. O Clube Smiles voltou a campanha em 23/09 (*18.000 milhas na hora, milheiro por R$ 10,80*), também **só para novos assinantes**. **A exceção é a Esfera**, que aceita upgrade — e mesmo assim reprova na régua como pacote de pontos"
  - "❓ **Duas linhas *Convertidos — Shopping Livelo* em 24/08** (26.178 e 52.356, obs. *equivalente ao valor pago em dinheiro*) — não aparecem na primeira página do extrato e não afetaram o saldo, que fecha sem elas. Item informativo a confirmar quando rolar o extrato para agosto"
  - "📝 **Notion atualizado hoje, depois de 24 dias parado.** A página *Viagens e Milhas* recebeu um bloco **ESTADO ATUAL — 24/09/2026** no topo, que prevalece sobre as seções antigas: saldos dos extratos de 20 e 24/09, a transferência Esfera→Iberia com a conta dos 22.500 Avios, a assinatura do Clube Pro, o encerramento do Clube LATAM, a consultoria inteira (passagem de abr/27, Viaje Fácil, réguas e calendário), as cinco decisões em aberto e a correção do erro da American. **As duas fontes seguem vivas por decisão do dono:** o painel carrega os saldos dos extratos, o Notion volta a ser a fonte dos pisos. As seções 1, 2, 3 e 6 da página antiga ficam como histórico — **podar numa próxima passagem**"
  - "🗂️ **Nenhum programa exporta extrato — a coleta é manual e vale sistematizar.** Livelo, Esfera, Smiles e LATAM só mostram o extrato em tela; não há CSV, API pública nem e-mail com anexo. **Providência a avaliar:** guardar os CSVs consolidados no próprio repo do site, num diretório de extratos, para que cada briefing empilhe o mês novo e a série histórica exista sem depender de print"
  - "**Lição de confirmação de operação (fechada hoje, com desfecho):** o e-mail de *pedido confirmado* da Esfera não diz para onde os pontos foram nem quantos — o painel carregou isso como incógnita por **três dias**. O extrato resolveu em uma linha: *Iberia Plus · −36.000 · pedido 317871629*. **Comprovante de transferência só existe no extrato de origem e na conta de destino**; o e-mail serve para datar a operação, não para encerrá-la. E a segunda metade da lição, nova: **o bônus não aparece na origem** — quem credita os três lançamentos é o programa de destino"
  - "**Lição de hipótese não conferida:** as *14.400 de bagagem* nasceram como explicação plausível em 15/09, foram repetidas em cinco briefings sem prova, e quando o extrato mostrou só *GOL LINHAS AEREAS − 14.400* o painel recuou. O detalhe da transação mostrou que **a explicação original estava certa o tempo todo**. Ficam as duas metades: **marcar hipótese como hipótese** — e **não abandoná-la no primeiro dado ambíguo**. O que resolve os dois erros é o mesmo gesto: **ir ao detalhe da transação cedo**"
  - "**Lição de data prometida:** *pontos a receber* tem data própria e ela muda. O painel carregou por dias que os pontos da Livelo cairiam em 19/09, quando a tela dizia **22/09** — e o valor certo era **9.645**. **Reler a caixa de *pontos a receber* a cada conferência**, em vez de propagar a data do briefing anterior"
  - "**Lição de comparação de clube:** milheiro não decide sozinho. **Comparar milheiro + desembolso total + reversibilidade** — e converter o custo até a moeda que vai emitir o bilhete: um ponto barato que só vira milha a 2:1 pode custar mais por trecho que uma milha aparentemente cara"
meta:
  destino: "Nova York"
  alvo: "março/2027"
