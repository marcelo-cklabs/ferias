alertas:
  - "🔴 **AÇÃO PENDENTE — LATAM Pass: o clube encerrou em 15/09.** As 19.478 milhas perderam a validade de 3 anos garantida pela assinatura e voltaram à regra padrão. Já houve perdas por expiração em set/2025 (-3.723 e -442) e jan/2026 (-3.500), sempre nesta época do ano. **Abrir o extrato, anotar a nova data de expiração e decidir se vale queimar num trecho doméstico barato.** Continua sendo o único item do painel com prazo correndo contra o saldo — aberto há 2 dias"
  - "🟠 **A janela de 80% Livelo → Smiles fechou em 15/09 23h59 e tudo indica que não foi aproveitada.** Dois dias depois não há e-mail de transferência da Livelo nem de crédito da Smiles — e na promo de 28/08 o crédito caiu no mesmo dia. O saldo Livelo segue em 23.236 pts, que virariam ≈ **41.800 milhas** a ≈ **R$ 12,22/milheiro**. **Confirmar no extrato** e, se de fato não foi feita, a próxima janela boa para a ponta Livelo é indefinida"
  - "📅 **Aniversário da Esfera em 22/09 — faltam 5 dias.** Em 2025 a casa ofereceu **até 30% de bônus em transferências para o Iberia Club** nesta mesma janela. É o gatilho declarado da rota Avios e a razão de a Esfera ter ficado de fora do bônus de 80%. Monitorar a partir de 20/09"
  - "🔵 **Esfera → TAP Miles&Go com paridade reduzida até 29/09 — avaliado e reprovado.** A campanha melhora a taxa de 2,7 para **2,2 pontos = 1 milha** (2,2 para 1,8 só para assinantes do Clube Esfera, que não é o caso). Mesmo assim os 32.556 pts virariam ~14.800 milhas TAP, **menos que os 16.278 Avios do 2:1 da Iberia sem bônus nenhum**. Não compete com a rota Avios e não justifica gastar a Esfera antes do dia 22"
  - "⚪ **LATAM Pass 25% de bônus até 18/09 — abaixo do piso e sem origem útil.** A campanha inclui Itaú, Credicard, C6, BTG e outros, mas **não** Livelo nem Esfera; o piso C6→LATAM é 50% e o saldo C6 é de 226 átomos. Sem ação"
  - "⚪ **Esfera → ConnectMiles (Copa) com 55% e Premmia → Smiles com até 120%: fora da estratégia.** Nenhuma das duas rotas está nos pisos do briefing e nenhuma alimenta Smiles, Iberia ou LATAM pela ponta útil. A Esfera segue reservada para o dia 22. Sem ação"
  - "📈 **+21.306 pontos da Fidelidade Bradesco em 10/09 — segue sem explicação.** O log de 31/08 concluiu que o gasto não estava mais indo no Bradesco; uma fatura que rende 21,3 mil pontos diz o contrário. **Confirmar a origem** (fatura gorda, acúmulo de ciclos ou campanha) — é o número que decide se a **mudança de rota Bradesco → Santander** de 31/08 continua de pé"
  - "🟠 **Clube Esfera: a oferta de até 100.000 pontos em 12 meses vence em 20/09.** Milheiro a partir de **R$ 25,40** no Exclusive anual à vista — melhor que os R$ 32,00–37,62 do Mês do Cliente, recusados em 11/09. No 2:1 da Iberia o Avios ainda sai a ≈ **R$ 51/milheiro**. **A confirmar antes de decidir:** se o Clube eleva o teto de bônus em transferências (pendência aberta desde 31/08)"
  - "✈️ **Viagem ao Nordeste encerrada — REC → GYN voou em 12/09/2026** (115.600 milhas, 2 pax). **Ação pendente:** localizar no extrato Smiles o lançamento da bagagem e fechar de vez o alerta das 14.400"
  - "🔄 **Mudança de rota (31/08): o gasto principal migra do Bradesco para o Santander**, alimentando a Esfera; o C6 vira a frente da Sabrina. Duas frentes paralelas: Esfera → Iberia/LATAM (Europa e Executiva) e Átomos → Smiles (EUA e América do Sul). A definir: condição de isenção da anuidade Santander Unlimited (R$ 2.200/ano), destino do Bradesco Infinite e se o Clube Livelo (R$ 538/ano) será renovado em 02/06/2027"
  - "❓ **Duas linhas *Convertidos — Shopping Livelo* em 24/08** (26.178 e 52.356, obs. *equivalente ao valor pago em dinheiro*) — sem sinal de mais ou menos e sem efeito no saldo. Abrir o detalhe para entender o que são"
  - "🚫 **Clube Livelo *até 25 mil pontos*, Clube Livelo Special *até 50 mil* e Clube Smiles *até 37 mil milhas*: não se aplicam.** Todas as ofertas são restritas a **novas adesões** e o Marcelo já assina os dois planos. Nenhuma entra como oportunidade"
  - "📝 **Fonte da verdade desatualizada:** a página *Viagens e Milhas* no Notion não é editada desde **31/08** e ainda traz os saldos daquela data (Livelo 630, Smiles 314.664). Os números deste painel vêm dos briefings de 11–16/09, mais novos e conferidos por print. **Atualizar o Notion** para que as duas fontes voltem a bater"
  - "**Lição de leitura de saldo:** um saldo menor que o esperado nem sempre é erro do programa. Antes de montar contestação, checar os gastos avulsos do próprio período — bagagem, assento, upgrade — que saem do saldo sem aparecer como *resgate*"
