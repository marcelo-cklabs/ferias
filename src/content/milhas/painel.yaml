  duracao: "14 dias"
  situacao: "🟢 **O alvo deveria mudar de março para ABRIL/2027 — e agora há prova.** A consultoria do Matheus encontrou **GRU→JFK direto, American, econômica, 57.000 milhas/viajante em 6 de abril de 2027**, marcado *Menor preço · Recomendado · Outlet Clube Smiles*. **57k aprova com folga na régua de ≤ 75k** e fica **abaixo do benchmark saver de 59,4k** — é a primeira evidência concreta de assento saver real em abril, enquanto **março/27 segue seco nas duas pontas**. **O que falta é a volta em econômica:** a que ele achou (13 de abril, direto) é **premium economy a 121.700/viajante**, que reprova e levaria o casal a 357.400, acima do pool. **Saldo:** **307.291** milhas Smiles, conferidas linha a linha em 20/09. Só a ida do casal custa 114.000 — sobra folga larga para a volta certa. **A ferramenta nova é o Viaje Fácil:** por **R$ 249,90 não reembolsáveis** trava a reserva agora e deixa quitar 60 dias antes do voo, devolvendo **4.000 milhas bônus** ao assinante do Clube quando a compra é concluída. Permite **garantir a ida de 6/4 assim que ela aparecer** e caçar a volta depois — ataca o gargalo de assento, que sempre foi o problema real. ⚠️ Não entra em débito automático. **A frente Avios saiu do papel e está contada:** a Esfera transferiu **36.000 pontos ao Iberia Club em 22/09** (pedido 317871629, confirmado no extrato) → **18.000 Avios base + 1.800 de promoção + 2.700 de Clube = 22.500 Avios**, creditando no Iberia Club em até 3 lançamentos entre **29/09 e 01/10**. Isso é praticamente **um trecho GRU→JFK inteiro em metal American** (~23.000 via Finnair Plus). Origens aceitas além de GRU: GIG, CNF, SSA, REC e BSB. Plano B: direto em dinheiro (~R$ 8–10k o casal)."
  gatilhos:
    - "volta JFK→GRU econômica · abril/27 · 2 assentos"
    - "ida GRU→JFK 06/04/27 a 57k · travar via Viaje Fácil (R$ 249,90)"
    - "chegada dos 22.500 Avios no Iberia Club · 29/09 a 01/10"
    - "bônus de transferência p/ Smiles que inclua Livelo · ≈ 33.083 pts parados"
    - "expiração das 19.478 milhas LATAM · conferir no extrato"
