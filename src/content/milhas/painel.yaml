alertas:
  - "🟢 **Terça, 22/09, é dia cheio: aniversário da Esfera E os 9.645 pontos da Livelo caindo.** O extrato da Livelo de hoje corrige duas informações que o painel carregava erradas — os pontos a receber são **9.645** (não 9.635) e entram **a partir de 22/09** (não 19/09). Efeito: na terça o saldo Livelo vai a **≈ 33.083 pts**, que numa janela de 80% virariam **≈ 59.500 milhas Smiles**. No mesmo dia abre a janela esperada da Esfera → Iberia. **Duas frentes exigindo atenção no mesmo dia** — e são independentes: a da Esfera tem hora marcada e precedente; a da Livelo depende de a Smiles abrir campanha, o que este mês aconteceu três vezes em quatro dias"
  - "🟢 **A Esfera a 30% FECHA um trecho inteiro em Avios.** Com 36.158 pts: **18.079 Avios** sem bônus, **21.694** a 20% e **23.502** a 30%. Como o GRU→JFK em metal American via Finnair Plus custa **~23.000 Avios/trecho**, o cenário de assinante **cobre um trecho completo, com ~500 Avios de folga** — no saldo de 31/08 parava em 21.161 e não fechava. A 20% faltam ~1.300. O mínimo de transferência do plano Pro (20.000 pts) já está coberto e a taxa é zero. **Conferir o saldo de novo na terça de manhã** — o mês ainda pode creditar antes de a campanha abrir"
  - "✅ **Reconciliação FECHADA nos dois extratos lidos hoje — e a história que os lançamentos contam.** **Esfera:** 39 lançamentos, +3.602, sem sobras; 1.292 do Clube e 2.310 do Unique Mastercard BL, com o padrão de estabelecimentos denunciando a **viagem ao Nordeste inteira** (Posto da Lagosta, Supermercado Porto do…, Muro Alto Bistro, JrMaragogi, Amado Camarão, Localiza, entre 03 e 15/09). Por data: 03/09 **289** · 04/09 **50** · 06/09 **519** · 09/09 **615** · 11/09 **294** · 12/09 **90** · 15/09 **453** · 18/09 **1.292**. **Livelo:** 630 + 1.000 + 300 + 21.306 + 202 = **23.438**, também sem sobras; o resgate de **-15.000 para a Smiles em 28/08** está confirmado no extrato. **Ponta solta menor:** o lançamento *Novo Clube 1000* da Esfera creditou **1.292**, mas o card do Clube reconhece só **1.000** — os **292** seguem sem explicação em tela"
  - "⚠️ **A ressalva que o extrato impõe: a Esfera vira fluxo, mas um fluxo LENTO.** Setembro rendeu 2.310 pts de cartão — e foi um mês **com viagem**, portanto acima do normal. Somando o Clube, o ritmo fica em algo entre **2.000 e 3.300 pts/mês** em mês comum. Como o plano Pro só transfere **a partir de 20.000 pts**, cada novo lote transferível leva de **6 a 10 meses** a se formar. **Isso qualifica a tese de 31/08** (*com o Santander alimentando a Esfera, a rota Avios deixa de ser recurso escasso e vira fluxo*): vira fluxo, sim, mas na cadência de **um a dois lotes por ano**, não de uma torneira aberta. Consequência prática: se transferir tudo na terça, a Esfera zera e **a próxima janela só chega em 2027** — o que reforça transferir **no melhor bônus disponível**, não no primeiro que aparecer"
  - "🔴 **AÇÃO PENDENTE — LATAM Pass: o clube encerrou em 15/09, há 5 dias.** As 19.478 milhas perderam a validade de 3 anos garantida pela assinatura e voltaram à regra padrão. Já houve perdas por expiração em set/2025 (-3.723 e -442) e jan/2026 (-3.500), sempre nesta época do ano. **Abrir o extrato, anotar a nova data de expiração e decidir se vale queimar num trecho doméstico barato.** Continua sendo o único item do painel com prazo correndo contra o saldo"
  - "📅 **Aniversário da Esfera na terça, 22/09 — a varredura de hoje ainda não encontrou a campanha no ar.** As páginas oficiais de aniversário listam apenas Azul (até hoje), TAP (até 29/09) e Copa (até 30/09); **nenhuma menção a Iberia Club até agora**. Precedente que sustenta a espera: em 2025 a campanha *Esfera → Iberia Club* rodou de **22 a 24/09**, com **30% para assinantes do Clube Esfera e 20% para os demais**, teto de 1.000.000 pts por CPF e bônus creditado em até 7 dias úteis após o fim. O print de hoje reforça o lado do assinante: **condições exclusivas em campanhas** aparece como benefício explícito do plano Pro. **Ressalva honesta:** aniversário de programa não garante campanha — os calendários do setor tratam a data como *provável*, não certa. **Monitorar terça de manhã e agir na abertura**"
  - "✅ **Confirmado nos dois extratos: as duas frentes estão rendendo ao mesmo tempo.** Na Esfera, 38 dos 39 lançamentos de setembro são do **Cartão Unique Mastercard BL** — o gasto corrente migrou mesmo. Na Livelo, o rótulo do crédito de 10/09 é **Fidelidade Bradesco**, +21.306 num lançamento único. Hipótese a testar na próxima fatura: se for acúmulo de ciclos anteriores e não gasto corrente, a migração para o Santander está mais limpa do que o alerta original sugeria. Fora isso, a Livelo só recebeu miudezas de parceiros (Mercado Livre, GIFTTY) e o 1.000 do Clube"
  - "🟠 **CORREÇÃO do painel de ontem — o bônus do Clube Esfera vale TAMBÉM para upgrade, e o prazo era HOJE, 20/09.** O alerta de ontem colocou as ofertas de clube no balaio de *só novas adesões*; isso está certo para Livelo e Smiles, mas **errado para a Esfera**: a campanha de aniversário publicada em 14/09 aceita **adesão ou atualização imediata** e paga **350% no Pro, 400% no Master, 450% no VIP e 500% no Exclusive**, em 12 parcelas mensais. Preços: Pro R$ 43,90, Master R$ 106,90, VIP R$ 211,90 e Exclusive R$ 799,90 por mês. **Mesmo assim o upgrade REPROVA na régua** — por isso não virou oportunidade: no Master o pacote sai a ~R$ 32/milheiro Esfera, no VIP ~R$ 31 e no Exclusive ~R$ 28; como a Iberia converte a **2:1**, o Avios custa de fato **R$ 56 a R$ 64 o milheiro**. Um trecho GRU→JFK a 23k Avios sai por **R$ 1.300–1.470**, contra **~R$ 1.040** do mesmo trecho via Smiles a 65k e R$ 16/milheiro. **O caminho mais barato para a meta continua sendo o pipeline Smiles, não comprar Esfera cara**"
  - "⚪ **Esfera → Azul Fidelidade, até 110%, morre hoje — reprovada pela terceira vez.** Maior bônus vivo no radar e o único que aceita o saldo Esfera, mas expira **dois dias antes** do aniversário. Recusada pelos mesmos dois motivos de sempre: a Azul **não serve a meta** (sem malha para Nova York em econômica com saver) e transferir esvaziaria justamente o pool reservado para a Iberia — que, com o saldo de hoje, está a um bônus de 30% de fechar um trecho inteiro. Pior ainda à luz do ritmo de acúmulo: esvaziar agora custaria **6 a 10 meses** para reconstituir o mínimo de transferência. **Bônus grande na moeda errada continua sendo bônus errado** — depois de hoje o assunto sai do painel"
  - "🔴 **Livelo → Smiles 80%: encerramento CONFIRMADO na fonte oficial.** A página da campanha (*Clube Smiles Day · bancos-livelo-09-2026*) foi lida hoje e traz a vigência literal — **das 10h de 17/09 às 23h59 de 18/09**, com o texto *promoção encerrada*. Fim da dúvida levantada pela regra de 28/08 (*manchete de blog não é prazo*): desta vez o regulamento confirma o blog. Foram **três janelas de 80% em quatro dias** com o saldo parado. **A providência segue a mesma:** o briefing da manhã não alcança campanha que abre à tarde e morre à meia-noite — ou se cadastra no momento em que o e-mail chega, ou a ponta Livelo não entra na conta da meta. **Com os 9.645 entrando na terça, o que está em jogo na próxima janela sobe para ≈ 59.500 milhas**"
  - "🟢 **Clube Esfera plano Pro — assinatura confirmada em tela em 20/09:** *Ativo*, assinante desde **18/09/2026**, 1.000 pts/mês, última mensalidade de **R$ 43,90 paga em 18/09**. O que se comprou foi a **condição de assinante 4 dias antes do aniversário**, que é exatamente o que a campanha da Iberia exige. A tela também mostra o **1º aniversário de Clube em 11 meses** (compra de pontos passa de 20% para 50% off, catálogo de 10% para 15%, viagens de 5% para 10%) — argumento de permanência, não de upgrade. **Régua de saída mantida:** reavaliar assim que o bônus da Iberia creditar (~início de outubro); 12 meses seguidos custam R$ 526,80 por 12.000 pts"
  - "🔵 **Esfera → TAP Miles&Go até 29/09 — alternativa de Europa, atrás do Avios.** Com o Clube assinado a paridade cai de 2,2 para **1,8 pontos = 1 milha**: os 36.158 pts dão ≈ **20.088 milhas TAP**, acima dos 18.079 Avios que a Iberia entrega sem bônus. **Mesmo assim perde para a meta ativa** — milha TAP não é Avios, a malha é Europa via Lisboa e a rota Avios emite o **direto GRU→JFK** em metal American por ~23k/trecho, que o cenário de 30% agora cobre. O prazo 29/09 é **posterior ao dia 22**: dá para esperar a oferta da Iberia sem perder esta porta"
  - "⚪ **Esfera → ConnectMiles (Copa), 55% até 30/09 — segue reprovado.** Paridade de **3 pontos = 1 milha** contra o **2:1** da Iberia: os 36.158 pts viram ≈ 18.682 milhas Copa com bônus cheio, praticamente o mesmo que os 18.079 Avios **sem bônus nenhum**. No uso é pior: conexão obrigatória no **Panamá** e a partir de 25.000/trecho para os EUA em econômica. Prazo posterior ao dia 22. Sem ação"
  - "🔵 **Iberia Club com até 20% de desconto no resgate — o calendário não fecha.** Campanha de 18/09: **reservas só até 23/09**, voos até **18/03/2027**, com 20% off justamente em Madri ↔ Nova York. Parece feita para a meta, mas **não dá para usar**: os Avios só existem depois da transferência do dia 22, cujo bônus credita em até 7 dias úteis — o prazo de reserva morre antes. E a rota é **via Madri**, não o direto GRU→JFK em metal American que a meta persegue. **Sem ação — pesquisar de novo assim que os Avios estiverem em conta**"
  - "🗂️ **Nenhum programa exporta extrato — a coleta é manual e vale sistematizar.** Livelo, Esfera, Smiles e LATAM só mostram o extrato em tela; não há CSV, API pública nem e-mail com anexo. O que funciona hoje é **copiar a tela e consolidar aqui**: os extratos de Esfera (39 lançamentos) e Livelo (10) de setembro já foram transformados em CSV nesta execução. **Providência a avaliar:** guardar esses CSVs no próprio repo do site, num diretório de extratos, para que cada briefing empilhe o mês novo e a série histórica exista sem depender de print"
  - "✈️ **Viagem ao Nordeste encerrada — REC → GYN voou em 12/09/2026** (115.600 milhas, 2 pax). O extrato da Esfera mostra o **outro lado da viagem**: o consumo em terra virou ~2.000 pts no Santander. **Ação pendente:** localizar no extrato Smiles o lançamento da bagagem e fechar de vez o alerta das 14.400"
  - "🔄 **Mudança de rota (31/08): o gasto principal migra do Bradesco para o Santander**, alimentando a Esfera; o C6 vira a frente da Sabrina. Duas frentes paralelas: Esfera → Iberia/LATAM (Europa e Executiva) e Átomos → Smiles (EUA e América do Sul). **Agora com evidência completa nos extratos** e com a cadência real medida. A definir: condição de isenção da anuidade Santander Unlimited (R$ 2.200/ano), destino do Bradesco Infinite e se o Clube Livelo (R$ 538/ano) será renovado em 02/06/2027 — decisão que convive com os R$ 526,80/ano do Clube Esfera se o Pro for mantido"
  - "❓ **Duas linhas *Convertidos — Shopping Livelo* em 24/08** (26.178 e 52.356, obs. *equivalente ao valor pago em dinheiro*) — não aparecem na primeira página do extrato lida hoje e não afetaram o saldo, que fecha sem elas. Segue como item informativo a confirmar quando rolar o extrato para agosto"
  - "🚫 **Clube Livelo *até 25 mil pontos*, Clube Livelo Special *até 50 mil* e Clube Smiles *até 37 mil milhas*: não se aplicam** — todas restritas a **novas adesões** e o Marcelo já assina os dois planos. O Clube Smiles rodou uma oferta de 17 a 21/09 (até 264 mil milhas no plano 20.000) que também é só para novos assinantes. **A exceção é a Esfera**, que aceita upgrade — ver alerta acima"
  - "📝 **Fonte da verdade desatualizada — 20 dias.** A página *Viagens e Milhas* no Notion foi lida nesta execução e continua sem edição desde **31/08**, ainda com Livelo 630, Smiles 314.664 e **Esfera 32.556**. Os saldos deste painel vêm dos extratos conferidos de **Livelo e Esfera em 20/09** e dos e-mails Smiles de 15–19/09 — por isso **não** foram revertidos para os do Notion. Os **pisos batem** entre as duas fontes. **Atualizar o Notion** com os saldos, a assinatura do Clube Esfera, a cadência de acúmulo medida e o encerramento do Clube LATAM"
  - "**Lição de leitura de saldo:** um saldo menor que o esperado nem sempre é erro do programa — checar os gastos avulsos do período (bagagem, assento, upgrade), que saem do saldo sem aparecer como *resgate*. E, do outro lado, um saldo que *parece* não fechar costuma fechar quando se lê o extrato inteiro em vez da primeira dobra"
  - "**Lição de data prometida:** *pontos a receber* tem data própria e ela muda. O painel carregou por dias a informação de que os pontos da Livelo cairiam em 19/09, quando a tela diz **22/09** — e o valor certo é **9.645**. **Reler a caixa de *pontos a receber* a cada conferência**, em vez de propagar a data anotada no briefing anterior"
  - "**Lição de comparação de clube:** milheiro não decide sozinho. **Comparar sempre milheiro + desembolso total + reversibilidade** — e converter o custo até a moeda que vai emitir o bilhete: um ponto barato que só vira milha a 2:1 pode custar mais por trecho que uma milha aparentemente cara"
