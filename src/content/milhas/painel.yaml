alertas:
  - "🎫 **RESERVA FEITA — a meta saiu do radar e virou compromisso com prazo.** Viaje Fácil confirmado em *Meus Voos*: **GRU 31/05/27 22h30 → JFK 01/06/27 07h10** e **JFK 07/06/27 20h20 → GRU 08/06/27 06h55**, American, direto, **cabine econômica, 6 passageiros** nas duas pontas. **Total a pagar: 729.000 milhas. Emitir até 01/04/2027.** Já desembolsado hoje: **R$ 3.218,94** (taxa de embarque R$ 2.969,04 + serviço Viaje Fácil R$ 249,90). Ao quitar, voltam **4.000 milhas de bônus** (dobro por ser Clube) — são cashback depois da emissão, **não ajudam a pagar**. ⚠️ A tela mostra *Sem saldo para quitar*, o que é esperado: são 307.291 contra 729.000"
  - "✅ **O ano foi confirmado por leitura, não por inferência.** A tela de *Meus Voos* traz as datas completas: **31/05/27** e **07/06/27**. A dedução de segunda-feira estava certa, mas agora é dado. **E o prazo bateu exatamente com o cálculo: 01/04/2027**, que é o que o próprio site mostra em *Emita esse voo até dia 01/04/27*"
  - "📐 **O PLANO DE QUITAÇÃO — faltam 421.709 milhas e ~R$ 5,5 mil.** De onde sai cada pedaço: **Clube Smiles** 2.000/mês × 6 meses = **12.000** (automático) · **Livelo** 33.234 numa janela de 80% = **59.821** · **C6 Átomos** ≈ **2.000** (conservador) · **restante a COMPRAR: 347.888 milhas**. Custo conforme o canal: **R$ 4.251** pela rota Livelo a R$ 22 o milheiro + 80% · **R$ 5.497** comprando Smiles direto no teto de R$ 15,80 · **R$ 6.958** no cenário ruim, sem promo, a R$ 20. **Total da viagem somando o que já foi pago: R$ 7.470 a R$ 10.177 — base R$ 8.716, cerca de R$ 1.453 por pessoa.** Em dinheiro essa passagem custaria R$ 4.000 a 6.000 por pessoa"
  - "📅 **Três janelas de compra, e não são equivalentes — front-load na Black Friday.** Pelo calendário da consultoria: **novembro (Black Friday) é a melhor do ano** · **janeiro** traz aniversário de Clube Azul, Caixa e **GOL/Smiles** · **março** é o mês do consumidor, mini black friday. **Divisão sugerida: 50% em novembro (~174.000), 30% em janeiro (~104.000), 20% em março (~70.000).** Não há razão para esperar: as milhas não expiram com Clube ativo e o prazo é fixo, então preço melhor cedo vence preço incerto depois. **Fechar tudo até 15/03/2027**, não 01/04 — o prazo real precisa de folga para transferência e imprevisto"
  - "🔑 **O canal mais barato provavelmente NÃO é comprar milha Smiles.** O ponto de equilíbrio é **Livelo a R$ 28,44 o milheiro**: abaixo disso, comprar Livelo e transferir a 80% sai mais barato que comprar Smiles direto a R$ 15,80. Promo de Black Friday da Livelo costuma pôr o milheiro em R$ 20–25, o que levaria o milheiro Smiles efetivo a **R$ 11 a R$ 14**. **Exige que duas coisas coincidam:** promo de compra Livelo e janela de transferência ≥70%. Como ponto Livelo não expira com Clube ativo, dá para **comprar primeiro e esperar a janela** — a ordem é essa, nunca o contrário"
  - "🔴 **Reativação Smiles a 330% vence SEGUNDA, 28/09 às 21h — e a pergunta segue sem resposta desde 20/09.** Quanto existe de milhas expiradas na conta? Abrir *Minhas Milhas → Reativar milhas*. A R$ 0,07 por milha, o milheiro fica em **≈ R$ 16,28**. **Com 421.709 milhas faltando e prazo em 01/04, R$ 16,28 deixou de ser caro** — é praticamente o teto do Matheus, por milha que entra na hora. **Prazo mais próximo do painel: 3 dias**"
  - "❓ **Verificar: a quitação aceita pagamento parcial?** Se a Smiles permitir abater as 729.000 em parcelas conforme as milhas chegam, o risco do plano cai muito — cada compra vira progresso travado. Se for tudo-ou-nada em 01/04, qualquer atraso de transferência no fim de março derruba a operação inteira. **É a pergunta operacional mais importante em aberto**, e provavelmente está nos Termos do Viaje Fácil"
  - "🛂 **Dependência que não tem nada a ver com milha: passaporte e visto americano para SEIS pessoas.** Levantar agora quem do grupo tem visto vigente e passaporte com validade suficiente para junho/2027, e quem precisa entrar na fila. Descobrir isso em março, com o bilhete travado, seria o pior momento possível. **Nenhuma milha resolve um visto negado ou uma fila de agendamento**"
  - "💳 **Onde colocar o gasto daqui para frente, agora que a meta tem nome.** Para Nova York só duas rotas chegam na Smiles: **Livelo** (cartão Bradesco) e **C6 Átomos** (1:1, cartão da Sabrina). Gasto que cai na **Esfera/Santander alimenta Iberia e LATAM, não Smiles** — ajuda a frente Europa, não esta reserva. **Vale reavaliar por seis meses para onde vai o gasto corrente**, e isso conflita frontalmente com a migração de rota decidida em 31/08. Decisão para o dono"
  - "🟢 **Os 22.500 Avios chegam entre 29/09 e 01/10 — e não entram nesta conta.** Transferência Esfera→Iberia de 22/09 (36.000 pts → 18.000 base + 1.800 promo + 2.700 Clube), crédito em até 3 lançamentos no **Iberia Club**. Conferir em *Meus Avios*. Programa separado, não soma nas 729.000 — valem ~1 trecho GRU→JFK em emissão à parte, ou ficam para a Europa. O Clube Pro se pagou nessa única operação: sem ele seriam 19.800, e os 2.700 de diferença valem ~R$ 148 contra R$ 43,90 de mensalidade"
  - "🔴 **AÇÃO PENDENTE há 10 dias — LATAM Pass.** Clube encerrou em 15/09, as 19.478 milhas voltaram à regra padrão. Já houve perdas por expiração em set/2025 e jan/2026, sempre nesta época. **Abrir o extrato, anotar a nova data de expiração e decidir.** Único saldo do portfólio com prazo correndo contra ele"
  - "🟠 **Teste marcado para ~18/10: os 292 pontos a mais.** *Novo Clube 1000* creditou **1.292** e o plano promete 1.000. O e-mail da Esfera de 21/09 fala em *bonificação paga em 12 parcelas mensais*. **Se cair outro ~292 por volta de 18/10, é bônus de adesão parcelado.** Custo do teste: olhar o extrato uma vez"
  - "⚖️ **Conflito de réguas, decisão adiada a pedido.** A consultoria usa **Iberia 20%** e **LATAM 20–25%**; os pisos daqui são **≥ 50%** e **Livelo→LATAM ≥ 30%**. Um piso que a operação contorna por exceção toda vez provavelmente está calibrado errado. Pisos inalterados, divergência documentada em **/consultoria**. **Nota nova:** a consultoria dizia *manter Clube Livelo* e o painel apontava para não renovar — **o financiamento desta reserva decide a favor de manter**, pelo menos até a última transferência"
  - "🚫 **O que não toca este portfólio.** Azul até 110% e Azul + ALL Accor (sem conta Azul) · Smiles ↔ Inter Loop 80% (ponta do Inter) · Smiles + KMV 100% (sem saldo) · Clube Smiles e Clube Livelo com bônus de adesão (só novos assinantes) · Esfera→LATAM 25% e Esfera→TAP/Copa (reprovam no piso e não há saldo). **Esfera→Iberia morreu em 22/09**; na cadência de 2.000–3.300 pts/mês o próximo lote de 20.000 leva de 6 a 10 meses"
  - "💡 **Regra ganha em setembro: a Localiza pagou DUAS VEZES pela mesma diária.** Smiles creditou +3.070 e +1.957 (5.027 milhas) e a Esfera ainda deu +23 pelo cartão. **Antes de compra grande em parceiro — locadora, hotel, seguro — checar acúmulo direto no programa além do cartão.** Com 421.709 milhas a levantar, cada achado desses conta"
  - "**Lição de data prometida — três repetições, virou regra.** *Pontos a receber* da Livelo prometeu 19/09, depois 22/09, agora **29/09**, e o valor caiu de 9.645 para **9.521**. Data e valor pioram juntos. **Pontos a receber não entram em conta de decisão até cair no saldo** — no plano de quitação eles estão contados como projeção, não como recurso"
  - "**Lição de vigência x oferta (24/09):** o painel marcou a promo de 30% da American como AGIR HOJE com vigência certa mas **sem tarifa verificada nas datas da meta**. Não havia nada aplicável. **Vigência confirmada não é oferta confirmada.** A régua de % serve para transferência; para resgate, quem decide é o preço do bilhete — como se provou hoje, quando a tarifa apareceu de verdade e era boa"
  - "**Lição de inferência, com desfecho feliz:** por três telas seguidas o ano da viagem não apareceu, e o painel se recusou a escrever *2027* como fato, mesmo com 31 de maio caindo numa segunda. A tela de *Meus Voos* confirmou. **A dedução estava certa e ainda assim esperar foi barato** — trinta segundos contra o risco de gravar premissa como dado numa compra de R$ 3,2 mil"
  - "**Lição de confirmação de operação:** o e-mail de *pedido confirmado* não diz para onde nem quanto. **Comprovante só existe no extrato de origem e na conta de destino** — e **o bônus não aparece na origem**, quem credita é o programa de destino"
  - "📝 **Notion desatualizado desde 24/09** — tem o bloco *ESTADO ATUAL*, mas sem a reserva, sem a correção de 6 passageiros e sem o plano de quitação. **Atualizar na próxima passagem.** O painel carrega os saldos e o cronograma; o Notion é a fonte dos pisos"
