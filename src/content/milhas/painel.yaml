alertas:
  - "🟢 **DECIDIDO 18/09 — Clube Esfera assinado no plano Pro: R$ 43,90/mês, mensal, 1.000 pts/mês.** Não é o desenho que o painel vinha recomendando (Exclusive anual à vista, milheiro a R$ 25,40) e **não** traz os *até 100.000 pontos bônus*, que eram exclusivos do Exclusive. **E está certo assim:** os R$ 25,40 exigiam um plano de 20.000 pts/mês a ~R$ 760–800/mês, ou seja **~R$ 8,2 mil à vista** — o painel comparou milheiros sem pesar que o mais barato estava fora de escala. O que se comprou aqui é diferente: **R$ 43,90 cancelável** para entrar na condição de assinante **4 dias antes do aniversário da Esfera**. Os 1.000 pts/mês saem a **R$ 43,90/milheiro** (≈ R$ 87,80/milheiro de Avios no 2:1) — caro, e por isso **não** são a razão da assinatura. **Régua de saída:** o valor está no teto de bônus do dia 22, não na mensalidade recorrente; 12 meses seguidos custariam R$ 526,80 por 12.000 pts. **Manter ativo até o bônus da Iberia creditar** (no precedente de 2025, até 7 dias úteis após o fim da campanha, ou seja ~início de outubro) e **reavaliar em seguida**. **A confirmar:** há referências de **R$ 79,90** como preço de tabela do Pro — verificar se os R$ 43,90 são condição promocional e o que acontece na renovação"
  - "🔴 **AÇÃO PENDENTE — LATAM Pass: o clube encerrou em 15/09.** As 19.478 milhas perderam a validade de 3 anos garantida pela assinatura e voltaram à regra padrão. Já houve perdas por expiração em set/2025 (-3.723 e -442) e jan/2026 (-3.500), sempre nesta época do ano. **Abrir o extrato, anotar a nova data de expiração e decidir se vale queimar num trecho doméstico barato.** Continua sendo o único item do painel com prazo correndo contra o saldo — aberto há 3 dias"
  - "📅 **Aniversário da Esfera em 22/09 — faltam 4 dias, e agora com a porta destravada.** Precedente confirmado: em 2025 a campanha *Esfera → Iberia Club* rodou de **22 a 24/09** com **30% para assinantes do Clube Esfera e 20% para os demais** — com o Pro ativo desde 18/09, o lado de 30% está garantido. Efeito sobre os 32.556 pts: **16.278 Avios** sem bônus, **19.533** a 20%, **21.161** a 30% — o delta de assinante vale ≈ **1.628 Avios** (~R$ 83 a R$ 51/milheiro), quase duas mensalidades do plano. **Ainda a confirmar:** se o teto de bônus escala por plano (o Pro é o 2º degrau de 6) ou se basta ser assinante — a documentação pública fala em *bônus maior em transferências* sem detalhar percentuais por faixa. **Monitorar a partir de 20/09 e agir na abertura da campanha**"
  - "🟠 **Segunda janela de 80% Livelo → Smiles perdida — e ela mostra que a cadência é curta.** Além da que fechou em 15/09, a Smiles abriu um *Clube Smiles Day* relâmpago em **17/09, das 10h às 23h59** (mesmo teto de 80% para assinantes de Clube Smiles e/ou Clube Livelo, limite de 300 mil milhas bônus, crédito até 02/10). O e-mail chegou às **16h21 de 17/09** — depois do briefing da manhã — e o saldo Livelo segue em 23.236 pts, que virariam ≈ **41.800 milhas**. **Conclusão prática:** o diagnóstico de ontem de que *a próxima janela boa é indefinida* está errado — houve duas em três dias. Vale **cadastrar-se na campanha assim que o e-mail chegar** e tratar bônus de 80% como evento recorrente, não raro"
  - "🔵 **Esfera → TAP Miles&Go até 29/09 — veredito REABERTO pela assinatura do Clube.** O cálculo de ontem reprovou a campanha usando a paridade de **2,2 pontos = 1 milha**, anotando que o degrau melhor, de **1,8**, era *só para assinantes do Clube Esfera, que não é o caso*. **Agora é o caso.** Nos 32.556 pts: a 2,2 dariam ~14.800 milhas TAP, mas a **1,8 dão ≈ 18.087** — acima dos **16.278 Avios** que a Iberia entrega sem bônus. **Mesmo assim continua atrás do Avios para a meta ativa:** milha TAP não é Avios, a malha é Europa via Lisboa e a rota Avios emite o **direto GRU→JFK** em metal American por ~23k/trecho. Leitura correta: o TAP deixou de ser descartado e passou a ser **a alternativa de Europa**, útil se a oferta da Iberia no dia 22 decepcionar. **O prazo 29/09 é posterior ao dia 22** — dá para esperar a campanha da Iberia sem perder esta porta"
  - "⚪ **Esfera → ConnectMiles (Copa), 55% de bônus até 30/09 — segue reprovado, mesmo com o Clube.** A paridade é **3 pontos = 1 milha**, contra o **2:1** da Iberia: os 32.556 pts viram **16.821 milhas Copa** com o bônus cheio, praticamente o mesmo que os **16.278 Avios** que a Iberia entrega **sem bônus nenhum** — os 55% apenas compensam a paridade pior. Pior ainda no uso: a Copa obriga conexão em **Panamá** e cobra a partir de **25.000/trecho** para os EUA em econômica (60.000 em Executiva). O que mudou com a assinatura é só o mínimo de transferência, que cai de 30.000 para **20.000 pts** — não altera o veredito. O prazo 30/09 é posterior ao dia 22. Sem ação"
  - "⚪ **LATAM Pass 25% de bônus — encerra hoje, 18/09, sem ação.** A campanha inclui Itaú, Credicard, C6, Revolut e BTG, mas **não** Livelo nem Esfera; o piso C6→LATAM é 50% e o saldo C6 é de 226 átomos. Sai do radar ao fim do dia"
  - "📈 **+21.306 pontos da Fidelidade Bradesco em 10/09 — segue sem explicação.** O log de 31/08 concluiu que o gasto não estava mais indo no Bradesco; uma fatura que rende 21,3 mil pontos diz o contrário. **Confirmar a origem** (fatura gorda, acúmulo de ciclos ou campanha) — é o número que decide se a **mudança de rota Bradesco → Santander** de 31/08 continua de pé. Ganhou peso: com o Clube Esfera assinado, a aposta no Santander passou a ter custo fixo mensal"
  - "✈️ **Viagem ao Nordeste encerrada — REC → GYN voou em 12/09/2026** (115.600 milhas, 2 pax). **Ação pendente:** localizar no extrato Smiles o lançamento da bagagem e fechar de vez o alerta das 14.400"
  - "🔄 **Mudança de rota (31/08): o gasto principal migra do Bradesco para o Santander**, alimentando a Esfera; o C6 vira a frente da Sabrina. Duas frentes paralelas: Esfera → Iberia/LATAM (Europa e Executiva) e Átomos → Smiles (EUA e América do Sul). A definir: condição de isenção da anuidade Santander Unlimited (R$ 2.200/ano), destino do Bradesco Infinite e se o Clube Livelo (R$ 538/ano) será renovado em 02/06/2027 — decisão que agora convive com os R$ 526,80/ano do Clube Esfera se o Pro for mantido"
  - "❓ **Duas linhas *Convertidos — Shopping Livelo* em 24/08** (26.178 e 52.356, obs. *equivalente ao valor pago em dinheiro*) — sem sinal de mais ou menos e sem efeito no saldo. Abrir o detalhe para entender o que são"
  - "🚫 **Clube Livelo *até 25 mil pontos*, Clube Livelo Special *até 50 mil* e Clube Smiles *até 37 mil milhas*: não se aplicam.** Todas as ofertas são restritas a **novas adesões** e o Marcelo já assina os dois planos. Nenhuma entra como oportunidade"
  - "📝 **Fonte da verdade desatualizada:** a página *Viagens e Milhas* no Notion não é editada desde **31/08** e ainda traz os saldos daquela data (Livelo 630, Smiles 314.664). Os números deste painel vêm dos briefings de 11–18/09, mais novos e conferidos por print — por isso os saldos **não** foram revertidos para os do Notion. **Atualizar o Notion**, incluindo a assinatura do Clube Esfera de hoje, para que as duas fontes voltem a bater"
  - "**Lição de leitura de saldo:** um saldo menor que o esperado nem sempre é erro do programa. Antes de montar contestação, checar os gastos avulsos do próprio período — bagagem, assento, upgrade — que saem do saldo sem aparecer como *resgate*"
  - "**Lição de comparação de clube:** milheiro não decide sozinho. O painel passou dias apontando R$ 25,40 como a melhor condição sem registrar que ela exigia ~R$ 8,2 mil à vista num plano de 20 mil pts/mês. **Comparar sempre milheiro + desembolso total + reversibilidade** — um plano mensal caro por ponto pode ser a escolha certa quando o que se compra é a condição de assinante numa janela curta"
