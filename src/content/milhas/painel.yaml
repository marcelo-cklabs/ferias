alertas:
  - "🟢 **JANELA CURTA E DIRETA NA META — até 30% OFF em TODAS as passagens American Airlines, e o prazo é HOJE às 10h.** Não é bônus de transferência: é desconto no resgate, e cai exatamente em cima do bilhete que a meta de NY persegue. **Vigência confirmada na própria página da campanha** (*csday-passagens-140926*): **das 15h de 21/09 às 10h de 24/09/2026**, horário de Brasília, **exclusiva para assinantes Clube e/ou clientes Magno/Diamante** — Marcelo assina o **Plano 2.000**, está dentro. A chamada oficial é *Todas as passagens American Airlines com desconto*; o Passageiro de Primeira mediu **até 30%** e citou GRU→DFW a 65.700 milhas. **Aritmética da meta:** o benchmark saver GRU→JFK é 59.400–72.000 milhas/trecho; com 30% cai para **≈ 41.600–50.400**, muito abaixo da régua de **≤ 75k/trecho**, e o casal ida e volta sairia por **≈ 166–202k** dentro de um pool de 307.291. **O gargalo não mudou — é assento, não milha.** Março/27 seguia seco nas duas pontas; se continuar, testar **abril/27**, onde já existem pares de ~14 dias mapeados (ida 02 ou 04 → volta 15 ou 17). **Abrir a busca em metal American antes das 10h** e emitir só se aparecerem **2 assentos na mesma data nas duas pontas**"
  - "🟠 **Esfera → LATAM Pass com 25% de bônus está no ar — e REPROVA no piso.** O piso da rota é **50%**; 25% fica na metade do caminho e não há exceção de meta que a salve (a exceção cobre **Esfera → Iberia**, não LATAM). Some-se o fato de que o destino natural da Esfera já foi decidido — Avios via Iberia, a 2:1 — e de que **o saldo pode já ter saído na transferência de 22/09**. **Sem ação**"
  - "🔴 **A campanha Esfera → Iberia Club morreu em 22/09 às 23h59 — a janela seguinte é uma incógnita.** Confirmado em duas fontes independentes: 25% para assinantes do Clube Esfera, 10% para os demais, encerrando às 23h59 de 22/09. A transferência de 22/09 às 12:25 entrou **dentro** da janela, o que é a boa notícia; a má é que **não há nova campanha Esfera → Iberia no radar de hoje**. Se a transferência levou o saldo inteiro, a próxima oportunidade da rota Avios depende de dois tempos: o saldo se refazer (**6 a 10 meses**, pela cadência medida) e uma nova campanha abrir"
  - "🔵 **Iberia Club com até 20% de desconto no resgate — encerrou em 23/09 e nunca foi alcançável.** Campanha de 18/09: reservas até 23/09, voos até 18/03/2027, 20% off em Madri ↔ Nova York. O impedimento era aritmético: os Avios da transferência de 22/09 **ainda não estão todos em conta** (o bônus leva até 7 dias úteis, ~01/10) e a rota é **via Madri**, não o direto GRU→JFK em metal American que a meta persegue. **Fica só o registro — refazer a busca assim que os Avios aparecerem**"
  - "🚫 **Quatro promoções vistosas do dia que não tocam este portfólio.** **Azul Fidelidade até 110%** (inclui Livelo e Esfera) e **Azul + ALL Accor 30%** — não há conta Azul e abrir uma agora não serve à meta. **Smiles ↔ Inter Loop até 80%** — o 80% do momento é da ponta Inter, que Marcelo não tem; é a mesma trava do alerta de 22–23/09. **Smiles + KMV até 100%** — não há saldo de Km de Vantagens. **Clube Livelo *até 157 mil pontos em 1 ano*, milheiro a partir de R$ 19,39** — o número é bom no papel, mas a rota de acúmulo migrou para Santander/Esfera em 31/08 e a decisão provável sobre o Clube Livelo é **não renovar** em 02/06/2027; pagar mais Livelo agora andaria contra a própria decisão. **Nenhuma entra no painel**"
  - "🟠 **Clube Esfera de novo em campanha (até 25/09) — e REPROVA de novo, pela mesma conta.** Adesão ou atualização imediata com bônus por plano: **2.000 pts no Pro** (R$ 43,90/mês), 5.000 no Master (R$ 106,90), 15.000 no VIP (R$ 211,90) e 60.000 no Exclusive (R$ 799,90). O milheiro Esfera fica entre **R$ 28,79 e R$ 37,63** — mas como a Iberia converte a **2:1**, o **Avios sai de fato a R$ 56–64 o milheiro**, e um trecho GRU→JFK a 23k Avios custaria **R$ 1.300–1.470** contra **~R$ 1.040** do mesmo trecho via Smiles a 65k e R$ 16/milheiro. **Não vira oportunidade.** O plano Pro já assinado em 18/09 continua se justificando por outro motivo — ele é a condição de assinante que destrava o bônus cheio nas campanhas —, não pelo pacote de pontos"
  - "⚠️ **A ressalva que o extrato impõe: a Esfera vira fluxo, mas um fluxo LENTO.** Setembro rendeu 2.310 pts de cartão — e foi um mês **com viagem**, portanto acima do normal. Somando o Clube, o ritmo fica entre **2.000 e 3.300 pts/mês** em mês comum. Como o plano Pro só transfere **a partir de 20.000 pts**, cada novo lote transferível leva de **6 a 10 meses** a se formar. **Isso qualifica a tese de 31/08** (*com o Santander alimentando a Esfera, a rota Avios vira fluxo*): vira fluxo, sim, mas na cadência de **um a dois lotes por ano**, não de uma torneira aberta. Se a transferência de 22/09 levou o saldo inteiro, **a próxima janela da Esfera só chega em 2027**"
  - "🔵 **Esfera → TAP Miles&Go até 29/09 e Esfera → ConnectMiles (Copa) 55% até 30/09 — provavelmente prejudicadas pela transferência de 22/09.** Ambas dependiam do mesmo saldo. A TAP entregava ≈ 20.088 milhas com a paridade de assinante (1,8:1) e a Copa ≈ 18.682 com bônus cheio (3:1) — as duas **já perdiam para o 2:1 da Iberia** antes mesmo do bônus. Ficam registradas só para fechar a comparação: **a escolha da Iberia era a certa**, e os prazos de 29 e 30/09 deixam de importar se a Esfera zerou"
  - "🔴 **AÇÃO PENDENTE — LATAM Pass: o clube encerrou em 15/09, há 9 dias.** As 19.478 milhas perderam a validade de 3 anos garantida pela assinatura e voltaram à regra padrão. Já houve perdas por expiração em set/2025 (-3.723 e -442) e jan/2026 (-3.500), sempre nesta época do ano. **Abrir o extrato, anotar a nova data de expiração e decidir se vale queimar num trecho doméstico barato.** É o item mais antigo em aberto do painel e o único com prazo correndo contra o saldo"
  - "💡 **Achado de otimização: a Localiza pagou DUAS VEZES pela mesma diária.** Em 15/09 a Smiles creditou **+3.070** (*Acumulo Localiza Clube Smiles*) e **+1.957** (*Localiza Coberturas Acúmulo Clube Smiles*) — **5.027 milhas**, ambas com a estrela de bônus do Clube. No mesmo aluguel, o extrato da Esfera registra **LOCALIZA RAC ACCGR20 +23 pts** pelo cartão Santander. **Regra prática a incorporar:** antes de qualquer compra grande em parceiro (locadora, hotel, seguro), checar se há acúmulo direto Smiles além do cartão. As 5.027 milhas saíram de graça de uma diária que já ia ser paga"
  - "✅ **Três dos cinco programas reconciliados linha a linha em 20/09, todos com diferença zero.** **Smiles:** 314.664 − 14.400 + 7.027 = 307.291. **Esfera:** 39 lançamentos, +3.602, com o padrão de estabelecimentos denunciando a **viagem ao Nordeste inteira** (Posto da Lagosta, Muro Alto Bistro, JrMaragogi, Amado Camarão, Localiza, entre 03 e 15/09). **Livelo:** 630 + 1.000 + 300 + 21.306 + 202 = 23.438. **Faltam C6 (print de 31/08) e LATAM Pass (print de 20/08)** para fechar os cinco. **Ponta solta menor:** o lançamento *Novo Clube 1000* da Esfera creditou **1.292**, mas o card do Clube reconhece só **1.000** — os **292** seguem sem explicação em tela"
  - "✅ **Confirmado nos extratos: as duas frentes estão rendendo ao mesmo tempo.** Na Esfera, 38 dos 39 lançamentos de setembro são do **Cartão Unique Mastercard BL** — o gasto corrente migrou mesmo. Na Livelo, o rótulo do crédito de 10/09 é **Fidelidade Bradesco**, +21.306 num lançamento único. Hipótese a testar na próxima fatura: se for acúmulo de ciclos anteriores e não gasto corrente, a migração para o Santander está mais limpa do que o alerta original sugeria"
  - "🔄 **Mudança de rota (31/08): o gasto principal migra do Bradesco para o Santander**, alimentando a Esfera; o C6 vira a frente da Sabrina. Duas frentes paralelas: Esfera → Iberia/LATAM (Europa e Executiva) e Átomos → Smiles (EUA e América do Sul). A definir: condição de isenção da anuidade Santander Unlimited (R$ 2.200/ano), destino do Bradesco Infinite e se o Clube Livelo (R$ 538/ano) será renovado em 02/06/2027 — decisão que convive com os R$ 526,80/ano do Clube Esfera se o Pro for mantido"
  - "🚫 **Ofertas de clube restritas a novas adesões não se aplicam.** Clube Livelo *até 25 mil pontos*, Livelo Special *até 50 mil* e Clube Smiles *até 37 mil milhas* — Marcelo já assina os dois. O Clube Smiles voltou a campanha em 23/09 (*18.000 milhas na hora, milheiro por R$ 10,80*), também **só para novos assinantes**. **A exceção é a Esfera**, que aceita upgrade — e mesmo assim reprova na régua, ver alerta acima"
  - "❓ **Duas linhas *Convertidos — Shopping Livelo* em 24/08** (26.178 e 52.356, obs. *equivalente ao valor pago em dinheiro*) — não aparecem na primeira página do extrato e não afetaram o saldo, que fecha sem elas. Item informativo a confirmar quando rolar o extrato para agosto"
  - "📝 **Fonte da verdade desatualizada — 24 dias.** A página *Viagens e Milhas* no Notion foi lida nesta execução e segue sem edição desde **31/08**, ainda com Livelo 630, Smiles 314.664 e Esfera 32.556. Os saldos deste painel vêm dos **extratos conferidos em 20/09** e **não** foram revertidos para os do Notion — reverter apagaria reconciliação feita linha a linha. Os **pisos batem** entre as duas fontes. **Atualizar o Notion** com: saldos de 20/09, a bagagem de 14.400 confirmada, o achado da Localiza, a assinatura do Clube Esfera Pro, a cadência de acúmulo medida, o encerramento do Clube LATAM e a transferência Esfera de 22/09"
  - "🗂️ **Nenhum programa exporta extrato — a coleta é manual e vale sistematizar.** Livelo, Esfera, Smiles e LATAM só mostram o extrato em tela; não há CSV, API pública nem e-mail com anexo. **Providência a avaliar:** guardar os CSVs consolidados no próprio repo do site, num diretório de extratos, para que cada briefing empilhe o mês novo e a série histórica exista sem depender de print"
  - "**Lição de hipótese não conferida (com desfecho honesto):** as *14.400 de bagagem* nasceram como explicação plausível em 15/09, foram repetidas em cinco briefings sem prova e, quando o extrato mostrou só *GOL LINHAS AEREAS − 14.400*, o painel recuou e tratou a bagagem como não comprovada. O detalhe da transação mostrou que **a explicação original estava certa o tempo todo**. Ficam as duas metades da lição: **marcar hipótese como hipótese** — mas também **não abandoná-la no primeiro dado ambíguo**. O que resolve os dois erros é o mesmo gesto: **ir ao detalhe da transação cedo**, em vez de raciocinar sobre o rótulo da linha"
  - "**Lição de confirmação de operação:** o e-mail de *pedido confirmado* da Esfera **não diz para onde os pontos foram nem quantos**. Comprovante de transferência só existe no **extrato de origem e na conta de destino** — o e-mail serve para datar a operação, não para encerrá-la"
  - "**Lição de data prometida:** *pontos a receber* tem data própria e ela muda. O painel carregou por dias que os pontos da Livelo cairiam em 19/09, quando a tela dizia **22/09** — e o valor certo era **9.645**. **Reler a caixa de *pontos a receber* a cada conferência**, em vez de propagar a data do briefing anterior"
  - "**Lição de comparação de clube:** milheiro não decide sozinho. **Comparar milheiro + desembolso total + reversibilidade** — e converter o custo até a moeda que vai emitir o bilhete: um ponto barato que só vira milha a 2:1 pode custar mais por trecho que uma milha aparentemente cara"
  - "**Lição de escopo do filtro (hoje):** o item mais valioso do dia **não era transferência bonificada** — era um **desconto de resgate** na companhia exata da meta, com janela de poucas horas. O filtro de pisos é bom para poupar atenção em bônus de transferência, mas **desconto em resgate na rota-alvo pede leitura própria**: ali o que importa não é o piso de %, é se o bilhete cabe na régua de ≤ 75k/trecho e se existem 2 assentos"
