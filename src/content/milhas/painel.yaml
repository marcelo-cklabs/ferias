  - "💡 **Regra ganha em setembro: a Localiza pagou DUAS VEZES pela mesma diária.** Smiles creditou +3.070 e +1.957 (5.027 milhas) e a Esfera ainda deu +23 pelo cartão. **Antes de compra grande em parceiro — locadora, hotel, seguro — checar acúmulo direto no programa além do cartão.** Com 411.622 milhas a levantar, cada achado desses conta"
  - "**Lição nova, e vale dinheiro: prazo oficial é teto, não expectativa — terceira confirmação.** O C6 prometia 5 dias úteis para a base e 09/10 para o bônus; os dois caíram em horas, como em 28/08. **Corolário prático: conferir o extrato do destino no mesmo dia da operação.** Se o painel tivesse esperado 30/09 para olhar, teria passado cinco dias com um número errado e teria perdido a chance de reconciliar 5.604 contra 5.381 enquanto a memória estava fresca"
  - "**Lição nova, sobre velocidade: detectar de manhã e executar no mesmo dia.** A janela C6→Smiles abriu às 10h de 24/09 e fechava às 23h59 de 25/09 — pouco mais de um dia. Briefing às 7h, transferência às 11h49, crédito à tarde. **Janela de transferência bonificada dura horas, não semanas: quando aparecer uma para a Livelo, é para agir na mesma manhã**, e os 33.234 pontos parados lá valem 59.821 milhas no dia em que isso acontecer"
  - "**Lição de print velho — cobrada três vezes em três dias, e hoje de novo por 223 átomos.** O C6 aparecia com 226 e tinha 5.381; à noite eram 5.381 e na hora da transferência eram **5.604**. Se o print velho tivesse sobrevivido mais um dia, a janela de 80% teria passado em branco por parecer troco. **Saldo que não foi lido hoje não é saldo, é lembrança.** Sobrou um: **LATAM Pass, 20/08**"
  - "**Lição de data prometida — três repetições, virou regra.** *Pontos a receber* da Livelo prometeu 19/09, depois 22/09, agora **29/09**, e o valor caiu de 9.645 para **9.521**. Data e valor pioram juntos. **Não entram em conta de decisão até cair no saldo** · 06/10: ~2,1 mil caíram e os **7.363** restantes passaram a *a partir de 27/10* — o *a partir de* parece marcar só o próximo lote, não o total (a quebra por lote está em *Ver detalhes*)"
  - "**Lição de vigência x oferta (24/09):** o painel marcou a promo de 30% da American como AGIR HOJE com vigência certa mas **sem tarifa verificada nas datas da meta**. Não havia nada aplicável. **Vigência confirmada não é oferta confirmada** — e no dia seguinte a tarifa apareceu de verdade, na tela, e era boa"
