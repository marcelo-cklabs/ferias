alertas:
  - "🔴 **TERCEIRA janela de 80% Livelo → Smiles perdida — a de 17/09 foi PRORROGADA e fechou às 23h59 de 18/09.** O e-mail do Melhores Destinos das 18h45 de 18/09 anunciou a prorrogação (*você tem até as 23h59 de hoje*) e o próprio e-mail da Smiles das 00h02 de 19/09 já traz a campanha como encerrada. Foram **três janelas em quatro dias** — 15/09, 17/09 e 18/09 — todas com os **23.236 pts Livelo parados**, que virariam ≈ **41.800 milhas**. **A conclusão de ontem se confirma e endurece:** bônus de 80% não é evento raro, é cadência semanal. **Providência concreta:** o briefing da manhã não alcança campanhas que abrem à tarde e morrem à meia-noite — vale **cadastrar-se na campanha no momento em que o e-mail chega**, ou aceitar que a ponta Livelo não entra na conta da meta"
  - "📅 **Aniversário da Esfera na terça, 22/09 — faltam 3 dias, com a porta destravada.** Precedente confirmado nesta varredura: em 2025 a campanha *Esfera → Iberia Club* rodou de **22 a 24/09**, com **30% para assinantes do Clube Esfera e 20% para os demais**, teto de 1.000.000 pts por CPF e bônus creditado em **até 7 dias úteis após o fim da campanha**. Com o Pro ativo desde 18/09, o lado de 30% está garantido. Efeito sobre os 32.556 pts: **16.278 Avios** sem bônus, **19.533** a 20%, **21.161** a 30% — o delta de assinante vale ≈ **1.628 Avios**, quase duas mensalidades do plano. **Ainda a confirmar:** se o teto escala por plano (o Pro é o 2º degrau de 6) ou se basta ser assinante. **Monitorar a partir de domingo, 20/09, e agir na abertura**"
  - "🔵 **Iberia Club com até 20% de desconto no resgate — e o calendário não fecha.** Campanha publicada em 18/09: **reservas só até 23/09**, voos até **18/03/2027**, com **20% off justamente em Madri ↔ Nova York** em todas as cabines. Parece feita para a meta, mas **não dá para usar**: os Avios só existem depois da transferência do dia 22, cujo bônus credita em até 7 dias úteis após 24/09 — o prazo de reserva morre antes. Some-se que a rota é **via Madri**, não o direto GRU→JFK em metal American que a meta persegue. **Sem ação — serve como aviso de que a Iberia roda desconto de resgate com frequência; vale pesquisar de novo assim que os Avios estiverem em conta**"
  - "⚪ **Esfera → Azul Fidelidade, até 110% + 2.000 pts, até 20/09 — o maior bônus do radar hoje, e mesmo assim REPROVADO.** É a única promoção viva que aceita o saldo Esfera, e expira **um dia antes** do aniversário. Recusada por dois motivos: a Azul **não serve a meta** (sem malha para Nova York em econômica com saver) e transferir esvaziaria exatamente o pool reservado para a Iberia, repetindo o erro estrutural que a mudança de rota de 31/08 veio corrigir. **O bônus grande na moeda errada continua sendo bônus errado**"
  - "🟢 **Clube Esfera plano Pro — assinatura CONFIRMADA por e-mail em 18/09** (pedido nº 317706570 às 12h03, boas-vindas às 15h30). R$ 43,90/mês, cancelável, 1.000 pts/mês. Não é o desenho que o painel vinha recomendando (Exclusive anual à vista) e **está certo assim**: o milheiro de R$ 25,40 exigia ~R$ 8,2 mil à vista. O que se comprou foi a **condição de assinante 4 dias antes do aniversário**. **Régua de saída:** manter ativo **até o bônus da Iberia creditar** (~início de outubro) e reavaliar em seguida; 12 meses seguidos custariam R$ 526,80 por 12.000 pts. **A confirmar:** há referências de **R$ 79,90** como preço de tabela do Pro — verificar se os R$ 43,90 são promocionais e o que acontece na renovação"
  - "🔴 **AÇÃO PENDENTE — LATAM Pass: o clube encerrou em 15/09.** As 19.478 milhas perderam a validade de 3 anos garantida pela assinatura e voltaram à regra padrão. Já houve perdas por expiração em set/2025 (-3.723 e -442) e jan/2026 (-3.500), sempre nesta época do ano. **Abrir o extrato, anotar a nova data de expiração e decidir se vale queimar num trecho doméstico barato.** Continua sendo o único item do painel com prazo correndo contra o saldo — **aberto há 4 dias**"
  - "🔵 **Esfera → TAP Miles&Go até 29/09 — alternativa de Europa, atrás do Avios.** Com o Clube Esfera assinado, a paridade cai de 2,2 para **1,8 pontos = 1 milha**: os 32.556 pts dão ≈ **18.087 milhas TAP**, acima dos 16.278 Avios que a Iberia entrega sem bônus. **Mesmo assim perde para a meta ativa** — milha TAP não é Avios, a malha é Europa via Lisboa e a rota Avios emite o **direto GRU→JFK** em metal American por ~23k/trecho. O prazo 29/09 é **posterior ao dia 22**: dá para esperar a oferta da Iberia sem perder esta porta"
  - "⚪ **Esfera → ConnectMiles (Copa), 55% até 30/09 — segue reprovado.** Paridade de **3 pontos = 1 milha** contra o **2:1** da Iberia: os 32.556 pts viram 16.821 milhas Copa com bônus cheio, praticamente o mesmo que os 16.278 Avios **sem bônus nenhum**. No uso é pior: conexão obrigatória no **Panamá** e a partir de 25.000/trecho para os EUA em econômica. Prazo posterior ao dia 22. Sem ação"
  - "📈 **+21.306 pontos da Fidelidade Bradesco em 10/09 — segue sem explicação, 9 dias depois.** O log de 31/08 concluiu que o gasto não estava mais indo no Bradesco; uma fatura que rende 21,3 mil pontos diz o contrário. **Confirmar a origem** (fatura gorda, acúmulo de ciclos ou campanha) — é o número que decide se a **mudança de rota Bradesco → Santander** continua de pé. Ganhou peso: com o Clube Esfera assinado, a aposta no Santander passou a ter custo fixo mensal"
  - "✈️ **Viagem ao Nordeste encerrada — REC → GYN voou em 12/09/2026** (115.600 milhas, 2 pax). **Ação pendente:** localizar no extrato Smiles o lançamento da bagagem e fechar de vez o alerta das 14.400"
  - "🔄 **Mudança de rota (31/08): o gasto principal migra do Bradesco para o Santander**, alimentando a Esfera; o C6 vira a frente da Sabrina. Duas frentes paralelas: Esfera → Iberia/LATAM (Europa e Executiva) e Átomos → Smiles (EUA e América do Sul). A definir: condição de isenção da anuidade Santander Unlimited (R$ 2.200/ano), destino do Bradesco Infinite e se o Clube Livelo (R$ 538/ano) será renovado em 02/06/2027 — decisão que agora convive com os R$ 526,80/ano do Clube Esfera se o Pro for mantido"
  - "❓ **Duas linhas *Convertidos — Shopping Livelo* em 24/08** (26.178 e 52.356, obs. *equivalente ao valor pago em dinheiro*) — sem sinal de mais ou menos e sem efeito no saldo. Abrir o detalhe para entender o que são"
  - "🚫 **Clube Livelo *até 25 mil pontos*, Clube Livelo Special *até 50 mil* e Clube Smiles *até 37 mil milhas*: não se aplicam.** Todas as ofertas são restritas a **novas adesões** e o Marcelo já assina os dois planos. O Passageiro de Primeira voltou a anunciar o Special em 18/09 — segue fora do radar"
  - "📝 **Fonte da verdade desatualizada — 19 dias.** A página *Viagens e Milhas* no Notion foi lida nesta execução e continua sem edição desde **31/08**, ainda com Livelo 630 e Smiles 314.664. Os saldos deste painel vêm dos briefings de 11–19/09, mais novos e conferidos por print — por isso **não** foram revertidos para os do Notion. Os **pisos batem** entre as duas fontes. **Atualizar o Notion** com os saldos, a assinatura do Clube Esfera e o encerramento do Clube LATAM"
  - "**Lição de leitura de saldo:** um saldo menor que o esperado nem sempre é erro do programa. Antes de montar contestação, checar os gastos avulsos do próprio período — bagagem, assento, upgrade — que saem do saldo sem aparecer como *resgate*"
  - "**Lição de comparação de clube:** milheiro não decide sozinho. **Comparar sempre milheiro + desembolso total + reversibilidade** — um plano mensal caro por ponto pode ser a escolha certa quando o que se compra é a condição de assinante numa janela curta"
