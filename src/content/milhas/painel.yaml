alertas:
  - "🟢 **A META SAIU DO PAPEL: cotação real, com 6 passageiros, na tela da Smiles.** **Ida** 31 de maio, GRU 22h30 → JFK 07h10, **American, econômica, direto, 09h40** — **57.000/viajante**, tags *Menor preço · Mais rápido · Recomendado · Outlet Clube Smiles* → **342.000**. **Volta** 7 de junho, JFK 20h20 → GRU 06h55, **American, econômica, direto, 09h35** — **64.500/viajante** → **387.000**. **Total 729.000 milhas + R$ 2.969,04** de taxa. **As duas pontas aprovam na régua de ≤ 75k**, média de **60.750 por trecho**. Duas surpresas boas: **o balde de 57k tem 6 assentos** (o total bateu 6 × 57.000 exato, o preço não subiu ao passar de 2 para 6) e **a volta é econômica de verdade** — a consultoria só tinha achado premium economy a 121.700. ⚠️ **O ANO NÃO APARECE NA TELA.** 31 de maio numa segunda-feira aponta para **2027** (em 2028 cai numa quarta), mas isso é inferência, não leitura — **confirmar antes de qualquer emissão**"
  - "⚠️ **CORREÇÃO ESTRUTURAL DO PAINEL: a meta é de 6 pessoas, não 2.** Todos os briefings até 24/09, a consultoria do Matheus e todas as réguas foram calculados em cima de **2 viajantes, março/2027, 14 dias**. O certo é **6 pessoas, 31/05 a 07/06, 7 dias**. Isso triplica a necessidade de milhas e é a origem de qualquer conclusão otimista deste painel nas semanas anteriores. **Os totais antigos (114.000 para o casal, folga de 73k) estão todos errados** — ficam no histórico como o que eram"
  - "💰 **A taxa deve ser paga em DINHEIRO, e a tela oferece quatro armadilhas.** Taxa de embarque: **R$ 2.969,04** pelos seis (R$ 494,84 por pessoa ida e volta — preço justo para os EUA). As opções de pagar em milha, com o milheiro implícito de cada uma: **193.080 milhas → R$ 15,38** · **154.800 + R$ 660 → R$ 14,92** · **135.600 + R$ 984 → R$ 14,64** · **58.800 + R$ 2.292 → R$ 11,51**. **Todas as quatro ficam abaixo do teto de compra de R$ 15,80** — seria queimar milha por menos do que custa comprá-la. E o argumento que encerra: **milha é o recurso escasso aqui, dinheiro não.** Pagar taxa em milha levaria o buraco de 421.709 para 614.789"
  - "🟢 **A tarifa é REEMBOLSÁVEL — melhor do que se esperava de uma Outlet.** Cancelamento custa **US$ 180 por viajante** (US$ 1.080 pelos seis, perto de R$ 6.000), cobrado no ato, **e as milhas voltam**. Existe porta de saída, e ela é cara mas real. Conferir também *Regras de tarifas e cancelamento* e o *Contrato de resgate* antes de emitir, e o que a tarifa Outlet permite de remarcação"
  - "🔑 **PENDÊNCIA CRÍTICA: o Viaje Fácil apareceu ou não?** Não dá para emitir hoje — são 729.000 milhas contra 307.291 em conta. **Sem Viaje Fácil não há como segurar esses assentos**, e seis lugares saver nas duas pontas na mesma semana é inventário raro que some sem aviso. O bloco de pagamento da taxa mostra só Milhas / Dinheiro / Smiles&Money; a opção deve aparecer no passo seguinte. **Risco real: tarifa Outlet pode não aceitar Viaje Fácil.** Condições: R$ 249,90 na hora, **não reembolsáveis**, quitação até **60 dias antes do voo** (≈ **01/04/2027** se for 2027), **4.000 milhas de volta** ao concluir por ser assinante do Clube, até 9 passageiros por reserva (os 6 cabem em uma), máximo de 2 reservas simultâneas. ⚠️ **Não entra em débito automático**"
  - "📐 **O plano de financiamento — e ele é mais barato do que parece.** Faltam **421.709 milhas**. A Livelo (33.234 projetados) numa janela de 80% entrega **59.821**, o que cobre só **14%**. **O grosso é compra: 361.888 milhas a R$ 15,80 ≈ R$ 5.718.** Somando taxa (R$ 2.969,04) e Viaje Fácil (R$ 249,90), o desembolso fica em **≈ R$ 8.937 — cerca de R$ 1.490 por pessoa**, ida e volta, direto, econômica com bagagem despachada. Em dinheiro essa passagem sai entre R$ 4.000 e R$ 6.000 por pessoa. **A meta não está inviável; ela está subfinanciada, e o remédio custa menos de R$ 6 mil**"
  - "📅 **Não comprar 362 mil milhas de uma vez em março — é assim que se perde o R$ 15,80.** São ~6 meses até o prazo do Viaje Fácil, e o calendário da consultoria diz onde estão as janelas: **novembro (Black Friday) é a principal**, depois **janeiro** (aniversário de Clube Azul, Caixa e GOL) e **março** (mês do consumidor). Comprar em tranches quando a promo bate, não quando o prazo aperta. **Segundo canal a monitorar:** comprar ponto Livelo barato e transferir a 80% — o ponto de equilíbrio contra o R$ 15,80 da Smiles é **Livelo a R$ 28,44 o milheiro**; abaixo disso, a rota Livelo sai mais barata que comprar Smiles direto. Exige que a promo de compra e a janela de 80% coincidam, o que costuma acontecer no mesmo calendário"
  - "🔴 **Reativação Smiles a 330% vence SEGUNDA, 28/09 às 21h — e segue sem resposta.** Pergunta aberta desde 20/09: **quanto existe de milhas expiradas na conta?** Abrir *Minhas Milhas → Reativar milhas*. A R$ 0,07 por milha, 330% põe o milheiro em **≈ R$ 16,28** — acima do alvo de R$ 15,80 do Matheus, mas **agora o contexto é outro**: com um buraco de 421.709 milhas e uma emissão concreta na mesa, R$ 16,28 deixa de ser caro e vira aceitável. **É o prazo mais próximo do painel: 3 dias**"
  - "⚖️ **Conflito de réguas, decisão adiada a pedido.** A consultoria usa **Iberia 20%** e **LATAM 20–25%**; os pisos daqui são **Esfera→Iberia/LATAM ≥ 50%** e **Livelo→LATAM ≥ 30%**. Um piso que a operação real contorna por exceção toda vez provavelmente está calibrado errado. **Os pisos seguem inalterados** e a divergência está em **/consultoria**. Menor: a consultoria diz *manter Clube Livelo*, o painel apontava para não renovar em 02/06/2027 — **e agora há um motivo novo para manter**, ver a nota da Livelo"
  - "🟢 **Os 22.500 Avios chegam entre 29/09 e 01/10 — e não servem para esta meta.** A transferência Esfera→Iberia de 22/09 (36.000 pts → 18.000 base + 1.800 promo + 2.700 Clube) credita em até 3 lançamentos no **Iberia Club**, não na Esfera. Conferir em *Meus Avios*. **São programa separado: não somam com a Smiles nas 729.000.** Valem ~1 trecho GRU→JFK em metal American, mas numa emissão à parte. O Clube Pro se pagou nessa única operação: sem ele o bônus teria sido 19.800, a diferença de 2.700 Avios vale ~R$ 148 contra R$ 43,90 de mensalidade"
  - "🔴 **AÇÃO PENDENTE há 10 dias — LATAM Pass.** O clube encerrou em 15/09 e as 19.478 milhas voltaram à regra padrão de validade. Já houve perdas por expiração em set/2025 e jan/2026, sempre nesta época. **Abrir o extrato, anotar a nova data de expiração e decidir se vale queimar num trecho doméstico.** É o item mais antigo em aberto e o único com prazo correndo contra o saldo"
  - "🟠 **Ponta solta com teste marcado: os 292 pontos a mais.** O lançamento *Novo Clube 1000* creditou **1.292** e o plano promete 1.000. O e-mail da Esfera de 21/09 traz a nota *bonificação paga em 12 parcelas mensais*. **Se cair outro ~292 por volta de 18/10, é bônus de adesão parcelado e o mistério fecha.** Custo do teste: olhar o extrato uma vez"
  - "🚫 **O que não toca este portfólio.** Azul até 110% e Azul + ALL Accor 30% (sem conta Azul) · Smiles ↔ Inter Loop 80% (ponta do Inter) · Smiles + KMV 100% (sem saldo KMV) · Clube Smiles *18.000 milhas na hora* e Clube Livelo *até 25 mil* (só novas adesões; já assina os dois) · Esfera→LATAM 25% e Esfera→TAP/Copa (reprovam no piso **e** não há saldo: 158 pts). **Esfera→Iberia morreu em 22/09** e a próxima janela útil só chega em 2027, porque na cadência de 2.000–3.300 pts/mês o próximo lote de 20.000 leva de 6 a 10 meses"
  - "💡 **Regra ganha em setembro: a Localiza pagou DUAS VEZES pela mesma diária.** Smiles creditou +3.070 e +1.957 (5.027 milhas) e a Esfera ainda deu +23 pts pelo cartão. **Antes de compra grande em parceiro — locadora, hotel, seguro — checar acúmulo direto no programa além do cartão.** Vale dinheiro de verdade quando a compra já ia acontecer"
  - "**Lição de data prometida — agora com TRÊS repetições, virou regra.** *Pontos a receber* da Livelo já prometeu **19/09**, depois **22/09**, agora **29/09** — e o valor caiu de 9.645 para **9.521** no caminho. Data e valor mudam juntos e sempre para pior. **Pontos a receber não entram em conta de decisão até cair no saldo.** O painel trata os 9.521 como projeção, não como recurso"
  - "**Lição de vigência x oferta (24/09):** o painel marcou a promo de 30% da American como AGIR HOJE com a vigência certa mas **sem tarifa verificada nas datas da meta**. Marcelo foi buscar e não achou nada aplicável. **Vigência confirmada não é oferta confirmada** — desconto de resgate só vira AGIR HOJE com tarifa na tela, na rota e nas datas certas. A régua de % serve para transferência bonificada; para resgate, quem decide é o preço do bilhete"
  - "**Lição de confirmação de operação:** o e-mail de *pedido confirmado* não diz para onde nem quanto — o painel carregou a transferência Esfera→Iberia como incógnita por três dias e o extrato resolveu em uma linha. **Comprovante só existe no extrato de origem e na conta de destino.** Segunda metade: **o bônus não aparece na origem** — quem credita é o programa de destino"
  - "**Lição de hipótese não conferida:** as *14.400 de bagagem* foram repetidas em cinco briefings sem prova, o painel recuou quando o extrato ficou ambíguo, e o detalhe da transação mostrou que a hipótese original estava certa o tempo todo. **Marcar hipótese como hipótese — e não abandoná-la no primeiro dado ambíguo.** O que resolve os dois erros é o mesmo gesto: ir ao detalhe da transação cedo"
  - "🗂️ **Nenhum programa exporta extrato — a coleta é manual.** Livelo, Esfera, Smiles e LATAM só mostram em tela; não há CSV nem API. **Providência a avaliar:** guardar CSVs consolidados num diretório do próprio repo, para que cada briefing empilhe o mês novo e a série histórica exista sem depender de print"
  - "📝 **Notion atualizado em 24/09** com o bloco *ESTADO ATUAL* no topo, que prevalece sobre as seções antigas. **Ele ainda não tem a cotação de 6 passageiros nem a correção de pax** — atualizar na próxima passagem. As duas fontes seguem vivas: o painel carrega os saldos dos extratos, o Notion é a fonte dos pisos"
