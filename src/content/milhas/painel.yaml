  - "🚫 **Clube Livelo *até 25 mil pontos* (prorrogado até 22/09, bônus Elo até 30/09): não se aplica.** O regulamento limita a oferta a **novas adesões** do Classic Flex anual — o Marcelo já é assinante do Classic Anual até 02/06/2027. Mesma coisa com o *até 37 mil milhas* do Clube Smiles 2.000, que ele já assina. Nenhum dos dois entra como oportunidade"
  - "**Lição de leitura de saldo:** um saldo menor que o esperado nem sempre é erro do programa. Antes de montar contestação, checar os gastos avulsos do próprio período — bagagem, assento, upgrade — que saem do saldo sem aparecer como *resgate*"
