  - "✅ **REATIVAÇÃO: MORREU, e a pergunta de cinco dias está fechada.** A tela da campanha, logada, diz **0 milhas expiradas**. Não havia lote nenhum ali. **O motivo é boa notícia:** Clube Smiles ativo desde 2022 protege o saldo, e as perdas por expiração do histórico eram todas **LATAM Pass** (−3.723 e −442 em set/2025, −3.500 em jan/2026), nunca Smiles. **Enquanto o Clube estiver ativo, reativação não é um canal para esta meta** — o piso de 200% fica no painel só para o caso de o Clube cair. **Sobra uma única janela antes da Black Friday: a Nomad, até 30/09**"
  - "📐 **O PLANO DE QUITAÇÃO, recalculado em 29/09 com os lotes 1 e 2 creditados.** Faltam **372.522**. De onde sai o resto: **Clube Smiles** 2.000/mês × 6 = **12.000** (automático) · **Livelo** só restam 713 + 9.521 a receber = 10.234, que numa janela de 80% dão **~18.421** (os outros 23.000 já viraram 39.100) · **C6** ~5.000/mês até março = **~30.000** no 1:1, ou ~54.000 numa nova janela · **restante a COMPRAR: ~312.101 milhas** — eram 309.801 no plano anterior, porque o lote 2 saiu a 70% e não a 80%. Custo conforme o canal: **R$ 3.814** pela rota Livelo a R$ 22 + 80% · **R$ 4.931** comprando Smiles direto no teto de R$ 15,80 · **R$ 6.242** no cenário ruim a R$ 20. **Total da viagem somando o que já foi pago: R$ 7.033 a R$ 9.461 — base R$ 8.150, cerca de R$ 1.358 por pessoa.** Em dinheiro essa passagem custaria R$ 4.000 a 6.000 por pessoa"
  - "📅 **Três janelas de compra, e não são equivalentes — front-load na Black Friday.** Pelo calendário da consultoria: **novembro (Black Friday) é a melhor do ano** · **janeiro** traz aniversário de Clube Azul, Caixa e **GOL/Smiles** · **março** é o mês do consumidor. **Divisão sugerida: 50% em novembro (~155.000), 30% em janeiro (~93.000), 20% em março (~62.000).** Não há razão para esperar: as milhas não expiram com Clube ativo e o prazo é fixo, então preço melhor cedo vence preço incerto depois. **Fechar tudo até 15/03/2027**, não 01/04 — o prazo real precisa de folga para transferência e imprevisto"
  - "🔑 **O canal mais barato provavelmente NÃO é comprar milha Smiles.** O ponto de equilíbrio é **Livelo a R$ 28,44 o milheiro**: abaixo disso, comprar Livelo e transferir a 80% sai mais barato que comprar Smiles direto a R$ 15,80. Promo de Black Friday da Livelo costuma pôr o milheiro em R$ 20–25, o que levaria o milheiro Smiles efetivo a **R$ 11 a R$ 14**. **Exige que duas coisas coincidam:** promo de compra Livelo e janela de transferência ≥70%. Como ponto Livelo não expira com Clube ativo, dá para **comprar primeiro e esperar a janela** — a ordem é essa, nunca o contrário. **Setembro deu quatro janelas de 80%, e a de hoje provou que dá para pegar e liquidar no mesmo dia**"
  - "💳 **Onde colocar o gasto nos próximos seis meses — e a operação de hoje reforça a resposta.** Para Nova York só duas rotas chegam na Smiles: **C6 Átomos** (1:1, direto, ~5.000/mês, e acabou de render 10.087 numa tacada) e **Livelo** (cartão Bradesco). Gasto que cai na **Esfera/Santander alimenta Iberia e LATAM, não Smiles** — ajuda a frente Europa, não esta reserva. **O C6 é hoje a rota mais eficiente para esta meta**, e isso conflita frontalmente com a migração de rota decidida em 31/08. **Vale reavaliar por seis meses.** Decisão para o dono. 📸 **A pergunta do cartão parece respondida pelo extrato da Esfera de 28/09:** duas cobranças da Smiles — *TxaEmbarq* (+397 pts) e *EMSemMilh* (+100 pts), em 26/09 — pontuaram no **Santander Unique**, não no C6. Se forem as da reserva (R$ 2.969,04 de taxa + R$ 249,90 de serviço), **a reserva rendeu ~500 pts Esfera em vez de átomos C6** — os átomos iriam para a Smiles; os pontos Esfera só servem à Europa. Confirmar na fatura. **Nas emissões GYN↔GRU, pagar as taxas num dos cartões C6**"
  - "⌛ **01/10: a janela da Nomad fechou em 30/09** — o painel não sabe se a conta foi aberta. Se foi, a conversão mínima de R$ 500 tem de sair em até 15 dias da abertura. Histórico: 🟡 **A Nomad ficou sozinha na semana, e por isso pesa mais.** Até **30/09**, conta nova rende até **48.000 milhas Smiles** na primeira conversão — quase cinco vezes o que o C6 acabou de entregar, e **12% de tudo que falta**. Com a reativação fora, é a última coisa acionável antes de novembro. ❓ **Duas perguntas travando:** já existe conta Nomad no CPF? E faz sentido converter ~US$ 2.000 agora para uma viagem em junho/27? **Se as duas respostas ajudarem, isto vira o lote 2 e é o maior antes da Black Friday**"
  - "❓ **Verificar: a quitação aceita pagamento parcial?** Se a Smiles permitir abater as 729.000 em parcelas conforme as milhas chegam, o risco do plano cai muito — cada compra vira progresso travado. Se for tudo-ou-nada em 01/04, qualquer atraso de transferência no fim de março derruba a operação inteira. **É a pergunta operacional mais importante em aberto**, e provavelmente está nos Termos do Viaje Fácil"
  - "🛂 **Dependência que não tem nada a ver com milha: passaporte e visto americano para SEIS pessoas.** Levantar agora quem tem visto vigente e passaporte com validade para junho/2027, e quem precisa entrar na fila. Descobrir isso em março, com o bilhete travado, seria o pior momento possível. **Nenhuma milha resolve um visto negado ou uma fila de agendamento**"
  - "✅ **VOLTA GRU→GYN COMPRADA em 12/10 — metade do buraco fechada.** 📧 **Confirmação da GOL recebida em 12/10 às 20h09: compra confirmada, seis bilhetes emitidos, assentos 01A a 01F.** GOL **G3 1492**, ter 08/06/2027, **17h00→18h40**, direto, **R$ 391,65 por pessoa** com seis assentos — o piso de R$ 400, batido no briefing do mesmo dia. Total **R$ 3.880,90**: passagens R$ 2.349,90 + assentos na fileira 1 R$ 656,00 + cinco malas R$ 875,00, em **3× num cartão C6** (final 5739), como o painel pedia. O American pousa às 06h55: são ~10h de folga em Guarulhos. **Falta a ida GYN→GRU dos seis — 6 trechos** — e a mala do Marcelo na volta. O rateio com os outros quatro está na página da viagem. Histórico: ✈️ **Buraco que a reserva abriu: o bilhete parte de GUARULHOS e o grupo está em Goiânia.** Faltam **GYN→GRU e GRU→GYN para seis pessoas — 12 trechos que não existem em lugar nenhum.** Decidir entre milhas (doméstico sai barato), dinheiro ou estrada, e **chegar em GRU com folga**: pousar no mesmo dia do voo das 22h30 com seis pessoas é risco desnecessário · 📉 **Monitorado desde 25/09 — linha de base por pessoa:** ida seg 31/05 **R$ 499** (diretos GOL 11h15→12h55 e LATAM 13h55→15h40, chegando até 16h) e volta ter 08/06 **R$ 484** (LATAM 11h40→13h15, 4h45 depois do pouso de JFK) — **R$ 5.898 para os seis, ida e volta**. A véspera (dom 30/05) custa **R$ 1.056**, o dobro, fora o hotel. Em milhas a LATAM cobra **14.772 + R$ 50** por trecho: as 19.478 do LATAM Pass pagam um trecho, não doze · 📉 **27/09: a volta caiu para R$ 448** (GOL 17h00→18h40, direto; a LATAM 11h40 segue a R$ 484) e a ida ficou em R$ 499 — **R$ 5.682 para os seis**, ainda acima do piso de R$ 400 · 🟢 **28/09, primeira leitura na Smiles: a volta sai por 14.300 milhas por pessoa COM SEIS ASSENTOS** (GOL 17h00→18h40, direto, ter 08/06) — a R$ 15,80 o milheiro são ~R$ 226 + taxas, **abaixo do piso de R$ 400**; os seis somam **85.800 milhas**, contra R$ 2.904 em dinheiro. A ida tem 14.300 só para menos de seis: com