    detalhe: "Campanha aberta em **14/09 às 10h**, encerra em **28/09 às 21h** — **reconfirmada viva na página oficial nesta varredura de 20/09**. O teto de 350% é do Plano 20.000 e das categorias Diamante/Magno; no **Clube Plano 2.000** o bônus é de **330%** — bem acima do piso de 200%. Exige Clube ativo, mínimo de 100 milhas, vale para milhas expiradas a partir de 2011 e as milhas bônus valem 12 meses. Precedente forte: a reativação de 01/06 pegou 320%, saiu a **R$ 16,67/milheiro** e se pagou sozinha no voo REC→GYN. **A confirmar antes de agir:** quanto existe de milhas expiradas no extrato Smiles hoje (a leva de 2026 já foi reativada em junho) e o custo efetivo do milheiro. Vale a mesma régua da compra de milhas — **não reativar sem emissão identificada**; o pool de 307.291 já cobre a meta de NY. **Restam 8 dias.**"
