  - "**Lição nova, e vale dinheiro: prazo oficial é teto, não expectativa — terceira confirmação.** O C6 prometia 5 dias úteis para a base e 09/10 para o bônus; os dois caíram em horas, como em 28/08. **Corolário prático: conferir o extrato do destino no mesmo dia da operação.** Se o painel tivesse esperado 30/09 para olhar, teria passado cinco dias com um número errado e teria perdido a chance de reconciliar 5.604 contra 5.381 enquanto a memória estava fresca"
